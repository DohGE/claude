<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>implementNewFeature</title>
<style>
  :root {
    --bg:#07090f; --card:#1c2438; --card-2:#121927; --border:#324061; --border-hi:#44567f;
    --text:#eef1f8; --muted:#9aa3ba; --accent:#7c8cf8; --accent-2:#a78bfa;
    --waiting:#64748b; --in_progress:#7c8cf8; --completed:#34d399; --failed:#f87171;
    --warn:#fbbf24;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; padding-left:236px; font-family:'Inter','Segoe UI',system-ui,sans-serif;
    line-height:1.5; transition:padding-left .15s;
    background:radial-gradient(1100px 550px at 70% -10%, #121728 0%, var(--bg) 55%) fixed;
    color:var(--text);
  }
  /* A rail on the left for what is not about the step on screen. It is fixed and the
     body is padded out of its way, so the pipeline column keeps the page to itself —
     panels inside it position against the viewport (the step-3 composer sticks to the
     bottom of it) and a wrapper around them would move the goalposts. */
  .sidebar { position:fixed; left:0; top:0; bottom:0; z-index:10; width:236px;
          overflow-y:auto; padding:28px 18px; border-right:1px solid var(--border);
          background:rgba(18,25,39,.55); transition:width .15s, padding .15s; }
  .sidebar h2 { margin:0 0 12px; font-size:12px; font-weight:700; text-transform:uppercase;
          letter-spacing:.9px; color:var(--muted); }
  .sidebar-body button { display:block; width:100%; margin:0 0 10px; text-align:left; }
  .sidebar .hint { margin:14px 0 0; }
  .rail-toggle { display:flex; align-items:center; justify-content:center; width:40px;
          height:40px; margin:0 0 18px; padding:0; background:var(--card-2);
          border:1px solid var(--border); color:var(--muted); }
  .rail-toggle:hover:not(:disabled) { color:var(--text); border-color:var(--border-hi);
          transform:none; filter:none; }
  /* Collapsed it is just the toggle — the width is the panel's, not the rail's. */
  html[data-rail=collapsed] .sidebar { width:58px; padding-left:9px; padding-right:9px; }
  html[data-rail=collapsed] .sidebar-body { display:none; }
  html[data-rail=collapsed] body { padding-left:58px; }
  .wrap { max-width:980px; margin:0 auto; padding:32px 20px 72px; }
  h1 { font-size:22px; margin:0 0 28px; letter-spacing:.2px; width:fit-content;
       background:linear-gradient(90deg,var(--accent),var(--accent-2));
       -webkit-background-clip:text; background-clip:text; color:transparent; }
  /* Task tabs appear only from the second task on — one task looks like it always did. */
  .tabs-bar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
  .tabs-bar[hidden], .viewbar[hidden] { display:none; }
  .tabs-bar .tab { display:inline-flex; align-items:center; gap:8px; margin:0; padding:8px 12px;
          max-width:100%; font-size:12.5px; font-weight:600; background:var(--card);
          color:var(--muted); border:1px solid var(--border); border-radius:10px; }
  .tabs-bar .tab:hover:not(:disabled) { color:var(--text); border-color:var(--border-hi);
          transform:none; filter:none; }
  .tabs-bar .tab.selected { color:var(--text); border-color:var(--accent);
          background:rgba(124,140,248,.14); }
  .tabs-bar .label { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:22ch; }
  .tabs-bar .dot { width:8px; height:8px; border-radius:50%; background:var(--waiting); flex:none; }
  .tabs-bar .dot.in_progress { background:var(--accent); }
  .tabs-bar .dot.completed { background:var(--completed); }
  .tabs-bar .dot.failed { background:var(--failed); }
  /* The one thing that tells the user a background task has stopped and needs them. */
  .tabs-bar .pending { color:var(--accent-2); font-size:11px; line-height:1; flex:none;
          animation:pulse 1.6s ease-in-out infinite; }
  .tabs-bar .tab { cursor:pointer; }
  .tabs-bar .tab:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .tabs-bar .close { margin:0; padding:0 3px; background:transparent; color:var(--muted);
          font-size:14px; line-height:1; flex:none; border-radius:4px; }
  .tabs-bar .close:hover:not(:disabled) { color:var(--failed); background:var(--card-2);
          transform:none; filter:none; }
  .stepper { display:flex; gap:8px; margin-bottom:28px; flex-wrap:wrap; }
  /* 88px basis keeps all nine tiles (every optional step on) on a single row at
     940px; a name longer than its tile wraps inside it. */
  .step { flex:1 1 88px; background:var(--card); border:1px solid var(--border); border-radius:14px;
          padding:14px 4px; text-align:center; transition:border-color .25s, box-shadow .25s;
          box-shadow:0 12px 28px -18px rgba(0,0,0,.9); }
  .step.in_progress { border-color:var(--accent);
          box-shadow:0 0 0 1px rgba(124,140,248,.35), 0 8px 24px -12px rgba(124,140,248,.45); }
  .step .num { display:inline-flex; align-items:center; justify-content:center;
          width:28px; height:28px; border-radius:50%; color:#0b0e14; font-size:13px; font-weight:700;
          background:var(--waiting); margin-bottom:8px; }
  .step.in_progress .num { background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff;
          animation:pulse 1.6s ease-in-out infinite; }
  .step.completed .num { background:var(--completed); }
  .step.failed .num { background:var(--failed); color:#fff; }
  @keyframes pulse { 50% { opacity:.55; } }
  .step .name { display:block; font-size:12.5px; font-weight:600; }
  .step .badge { display:block; font-size:10.5px; margin-top:5px; text-transform:uppercase;
          letter-spacing:.8px; font-weight:600; color:var(--waiting); }
  .step.in_progress .badge { color:var(--accent); }
  .step.completed .badge { color:var(--completed); }
  .step.failed .badge { color:var(--failed); }
  /* A reached step is a place the user may go back to. Switching is local to the
     page: it reaches neither the orchestrator nor any agent. */
  .step.clickable { cursor:pointer; }
  .step.clickable:hover { border-color:var(--border-hi); }
  .step.clickable:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .step.viewing { border-color:var(--accent-2);
          box-shadow:0 0 0 1px rgba(167,139,250,.45), 0 8px 24px -12px rgba(167,139,250,.5); }
  /* Shown only while the user looks at a step the pipeline is not on. */
  .viewbar { display:flex; align-items:center; justify-content:space-between; gap:12px;
          flex-wrap:wrap; margin:-14px 0 18px; padding:10px 14px; font-size:13px;
          color:var(--muted); background:rgba(167,139,250,.08);
          border:1px solid var(--border-hi); border-radius:10px; }
  .viewbar b { color:var(--text); }
  .viewbar button { margin:0; padding:6px 12px; font-size:12.5px; }
  .panel { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:24px;
          box-shadow:0 20px 50px -30px rgba(0,0,0,.8); }
  .panel h2 { margin:0 0 14px; font-size:17px; }
  label { display:block; font-size:13px; font-weight:600; margin:16px 0 6px; color:var(--muted); }
  label .req { color:var(--failed); }
  textarea, input[type=file], input[type=text], input[type=password], select {
          width:100%; font:inherit; color:var(--text); }
  textarea, input[type=text], input[type=password], select { background:var(--card-2);
          border:1px solid var(--border); border-radius:10px; padding:10px 12px; }
  select { cursor:pointer; }
  select:disabled { color:var(--muted); cursor:not-allowed; }
  /* Height is driven by autoGrow(); manual dragging would fight it. */
  textarea { min-height:90px; resize:none; overflow-y:hidden; }
  textarea:focus, input[type=text]:focus, input[type=password]:focus, select:focus {
          outline:none;
          border-color:var(--accent); box-shadow:0 0 0 3px rgba(124,140,248,.18); }
  /* Model and effort read as one setting, so they sit side by side and wrap together. */
  .agent-row { display:flex; gap:14px; flex-wrap:wrap; }
  .agent-row > div { flex:1 1 200px; }
  .agent-row label { margin-top:12px; }
  details.overrides { margin-top:16px; border:1px solid var(--border); border-radius:10px;
          padding:10px 14px; background:var(--card-2); }
  details.overrides summary { cursor:pointer; font-size:13px; font-weight:600;
          color:var(--muted); }
  details.overrides[open] summary { margin-bottom:6px; color:var(--text); }
  .agent-grid { display:grid; grid-template-columns:minmax(120px,1fr) 1fr 1fr; gap:10px 12px;
          align-items:center; margin-top:10px; }
  .agent-grid > span { font-size:13px; color:var(--muted); }
  /* A helper a step's agent spawns sits under its step, indented. */
  .agent-grid > span.role { padding-left:14px; font-size:12.5px; }
  /* Two short required fields that belong together: the branch and its commit message. */
  .field-row { display:flex; gap:0 14px; flex-wrap:wrap; }
  .field-row > div { flex:1 1 240px; }
  .agent-grid select { padding:8px 10px; }
  .panel h3 { font-size:14px; margin:22px 0 0; color:var(--accent); }
  input[type=file] { background:var(--card-2); border:1px dashed var(--border); border-radius:10px;
          padding:10px; color:var(--muted); }
  button { font:inherit; font-weight:600; border:0; border-radius:10px; padding:10px 20px; cursor:pointer;
          background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff; margin-top:16px;
          transition:filter .15s, transform .15s; }
  button:hover:not(:disabled) { filter:brightness(1.12); transform:translateY(-1px); }
  button:disabled { background:var(--border); color:var(--muted); cursor:not-allowed; transform:none; }
  button.secondary { background:var(--card-2); border:1px solid var(--border); color:var(--text); }
  button.danger { background:var(--failed); }
  .options button { display:block; width:100%; text-align:left; background:var(--card-2);
          color:var(--text); border:1px solid var(--border); margin-top:10px; font-weight:500; }
  .options button:hover:not(:disabled) { border-color:var(--accent); background:#1a2338;
          transform:none; filter:none; }
  .options button.selected { border-color:var(--accent); background:rgba(124,140,248,.14);
          color:var(--text); }
  .field-with-btn { position:relative; }
  .field-with-btn input { padding-right:46px; }
  .copy-wrap { position:relative; }
  .copy-wrap > textarea, .copy-wrap > input[type=text] { padding-right:44px; }
  button.copy { position:absolute; top:7px; right:7px; margin:0; padding:5px 7px;
          background:transparent; color:var(--muted); line-height:0; border-radius:8px; }
  button.copy:hover:not(:disabled) { color:var(--text); background:var(--card);
          transform:none; filter:none; }
  button.copy:disabled { background:transparent; }
  button.reveal { position:absolute; top:50%; right:6px; transform:translateY(-50%); margin:0;
          background:transparent; padding:6px 8px; color:var(--muted); line-height:0;
          border-radius:8px; }
  button.reveal:hover:not(:disabled) { color:var(--text); background:var(--card);
          transform:translateY(-50%); filter:none; }
  button.reveal[aria-pressed=true] { color:var(--accent); }
  button.reveal:disabled { background:transparent; }
  .switch { display:flex; align-items:center; gap:10px; margin-top:12px; }
  .switch input { appearance:none; -webkit-appearance:none; flex:none; margin:0; cursor:pointer;
          width:40px; height:22px; border-radius:99px; background:var(--card-2);
          border:1px solid var(--border); position:relative;
          transition:background .2s, border-color .2s; }
  .switch input::after { content:''; position:absolute; top:2px; left:2px; width:16px; height:16px;
          border-radius:50%; background:var(--muted); transition:transform .2s, background .2s; }
  .switch input:checked { background:rgba(124,140,248,.28); border-color:var(--accent); }
  .switch input:checked::after { transform:translateX(18px); background:var(--accent); }
  .switch input:disabled { opacity:.5; cursor:not-allowed; }
  .switch label { margin:0; color:var(--text); cursor:pointer; }
  /* The optional steps are one decision about the pipeline's shape, so they sit side by side. */
  .switch-row { display:flex; gap:0 18px; flex-wrap:wrap; }
  .switch-row > div { flex:1 1 180px; }
  /* One /doh:codeReview run per card, its flags as checkboxes. */
  .run { margin-top:10px; padding:8px 12px 10px; background:var(--card-2);
          border:1px solid var(--border); border-radius:10px; }
  .run-head { display:flex; align-items:center; justify-content:space-between; gap:10px;
          font-size:13px; font-weight:600; }
  button.run-rm { margin:0; padding:2px 8px; background:transparent; color:var(--muted);
          font-size:15px; line-height:1; border-radius:6px; }
  button.run-rm:hover:not(:disabled) { color:var(--failed); background:var(--card);
          transform:none; filter:none; }
  .flags { display:flex; flex-wrap:wrap; gap:4px 16px; margin-top:6px; }
  .flags label { display:flex; align-items:center; gap:6px; margin:0; font-weight:500;
          color:var(--text); cursor:pointer; }
  .flags input { margin:0; accent-color:var(--accent); cursor:pointer; }
  .hint { font-size:12.5px; color:var(--muted); margin:6px 0 0; }
  .hint.error { color:var(--failed); }
  /* Files already uploaded: a file input cannot be pre-filled, so they are listed. */
  ul.files { list-style:none; margin:8px 0 0; padding:0; font-size:12.5px; }
  ul.files li { display:flex; align-items:center; justify-content:space-between; gap:10px;
          padding:6px 10px; margin-top:6px; background:var(--card-2);
          border:1px solid var(--border); border-radius:8px; color:#c3c9d6; }
  ul.files .rm { margin:0; padding:2px 8px; background:transparent; color:var(--muted);
          font-size:15px; line-height:1; border-radius:6px; }
  ul.files .rm:hover:not(:disabled) { color:var(--failed); background:var(--card);
          transform:none; filter:none; }
  /* Picked but not uploaded yet: they go up with the next submit. */
  ul.files.picked li { border-style:dashed; }
  ul.files:empty { display:none; }
  ul.files .file { display:flex; align-items:center; gap:10px; min-width:0; }
  ul.files .file span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* An image shows what it is; a click opens it full size in a new tab. */
  .thumb { flex:none; display:block; width:56px; height:42px; overflow:hidden;
          border:1px solid var(--border); border-radius:6px; background:var(--card); }
  .thumb img { display:block; width:100%; height:100%; object-fit:cover; }
  .thumbs { display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; }
  .thumbs:empty { display:none; }
  .thumbs .att { position:relative; }
  .thumbs .thumb { width:72px; height:54px; }
  .thumbs .rm { position:absolute; top:-7px; right:-7px; margin:0; padding:0; width:20px;
          height:20px; font-size:13px; line-height:1; border-radius:50%; color:var(--muted);
          background:var(--card-2); border:1px solid var(--border); }
  .thumbs .rm:hover:not(:disabled) { color:var(--failed); transform:none; filter:none; }
  button.attach-btn { padding:10px 12px; line-height:0; }
  .attach-row { display:flex; align-items:center; gap:10px; margin-top:8px; }
  /* The Stop button rides the step's title, out of the way of the gate's own buttons. */
  .panel-head { display:flex; align-items:center; justify-content:space-between; gap:12px;
          margin-bottom:14px; }
  .panel .panel-head h2 { margin:0; }
  .panel-head button { margin:0; padding:6px 14px; font-size:12.5px; }
  .mockup-bar { display:flex; justify-content:space-between; align-items:center; gap:12px;
          flex-wrap:wrap; margin:18px 0 10px; }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; }
  .tabs button { margin-top:0; padding:6px 12px; font-size:12.5px; background:var(--card-2);
          color:var(--muted); border:1px solid var(--border); }
  .tabs button:hover:not(:disabled) { color:var(--text); border-color:var(--border-hi);
          transform:none; filter:none; }
  .tabs button.selected { color:var(--text); border-color:var(--accent);
          background:rgba(124,140,248,.14); }
  /* The cases of the view picked above: a second, quieter row. */
  .tabs.cases { margin:0 0 10px; }
  .tabs.cases:empty { display:none; }
  .tabs.cases button { padding:4px 10px; font-size:12px; font-weight:500; }
  .frame { overflow:hidden; border:1px solid var(--border); border-radius:12px;
          background:var(--card-2); }
  .frame iframe { border:0; display:block; transform-origin:top left; }
  .chat { margin-top:18px; border-top:1px solid var(--border); }
  .msg { padding:10px 0; border-bottom:1px solid var(--border); font-size:13px;
          white-space:pre-wrap; color:#c3c9d6; }
  .msg .who { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.8px;
          font-weight:700; margin-bottom:4px; color:var(--muted); }
  .msg.user .who { color:var(--accent); }
  /* The × that takes back a line of the user's own, while its step is live. */
  .msg { position:relative; }
  .msg .rm { position:absolute; top:8px; right:0; margin:0; padding:0; width:20px; height:20px;
          font-size:13px; line-height:1; border-radius:50%; color:var(--muted);
          background:var(--card-2); border:1px solid var(--border); }
  .msg .rm:hover:not(:disabled) { color:var(--failed); transform:none; filter:none; }
  .chat:empty { display:none; }
  .gate-actions { display:flex; gap:10px; flex-wrap:wrap; }
  /* What the step asks of the user, between its progress and its log: the question or the
     review is the one thing to act on, and what led up to it stays on screen around it. */
  .gate-card { margin:4px 0 16px; padding:16px 18px 18px; border:1px solid var(--border-hi);
          border-radius:12px; background:rgba(124,140,248,.07); }
  .gate-card > :first-child { margin-top:0; }
  .gate-label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.8px;
          color:var(--accent); }
  .gate-question { margin:6px 0 4px; white-space:pre-wrap; }
  /* The plan's risks and caveats: read before the plan is approved, so set apart from it. */
  .critical { margin:0 0 14px; padding:12px 14px; border:1px solid rgba(251,191,36,.45);
          border-left:4px solid var(--warn); border-radius:10px; background:rgba(251,191,36,.08); }
  .critical h3 { margin:0 0 6px; font-size:12px; text-transform:uppercase; letter-spacing:.8px;
          color:var(--warn); }
  .critical ul { margin:0; padding-left:18px; font-size:13px; }
  .critical li + li { margin-top:4px; }
  /* The composer rides the bottom of the viewport, so a long mockup page never
     scrolls the field to answer with off the screen. Its buttons stay level with
     the middle of the field, however tall it grows. */
  .composer { position:sticky; bottom:0; z-index:2; display:flex; flex-wrap:wrap; gap:10px;
          align-items:center; margin:16px -24px -24px; padding:14px 24px 16px;
          background:var(--card); border-top:1px solid var(--border); border-radius:0 0 16px 16px; }
  /* The pictures waiting to go with the message sit on a row of their own above it. */
  .composer .thumbs { flex:1 0 100%; margin:0; }
  /* A block, not the inline default: inside its .copy-wrap an inline field leaves a
     descender gap under it, and the buttons would centre on the gap too. */
  .composer textarea { flex:1; min-height:44px; display:block; }
  .composer .copy-wrap { flex:1; }
  .composer button { margin:0; flex:none; }
  .bar { height:8px; background:var(--card-2); border:1px solid var(--border); border-radius:99px;
          overflow:hidden; margin:10px 0 6px; }
  .bar > div { height:100%; background:linear-gradient(90deg,var(--accent),var(--accent-2));
          width:0; border-radius:99px; transition:width .4s; }
  .bar > div.indeterminate { width:100%; transition:none;
          background:linear-gradient(90deg,transparent,rgba(124,140,248,.75),transparent);
          background-size:40% 100%; background-repeat:no-repeat;
          animation:slide 1.4s ease-in-out infinite; }
  @keyframes slide { 0% { background-position:-40% 0; } 100% { background-position:140% 0; } }
  .op { font-size:13px; color:var(--muted); margin:6px 0 14px; }
  .log { list-style:none; margin:10px 0 0; padding:0; font-size:12.5px; }
  .log li { padding:6px 0; border-top:1px solid var(--border); color:#c3c9d6; }
  .log time { color:var(--waiting); margin-right:10px; font-variant-numeric:tabular-nums;
          font-family:ui-monospace,Consolas,monospace; font-size:11.5px; }
  pre.report, pre.summary-text { white-space:pre-wrap; background:var(--card-2);
          border:1px solid var(--border); border-radius:10px; padding:14px; font-size:13px;
          color:#c3c9d6; }
  /* A Mockoon environment is hundreds of lines — cap it so the copy button stays on screen. */
  pre#mockoonJson { max-height:45vh; overflow:auto; overflow-wrap:anywhere; }
  code { font-family:ui-monospace,Consolas,monospace; font-size:12.5px; padding:1px 6px;
          background:var(--card-2); border:1px solid var(--border); border-radius:6px; }
  .muted { color:var(--muted); font-size:13px; }
  a { color:var(--accent); }
  .notice { display:flex; align-items:center; gap:10px; margin-top:16px; padding:12px 14px;
          border:1px solid var(--border-hi); border-radius:10px; background:rgba(124,140,248,.08);
          font-size:13px; }
  /* A stopped agent: the step's panel stays as it was, with this under its title. */
  .stopped-note { margin:0 0 14px; padding:12px 14px; border:1px solid var(--border-hi);
          border-radius:10px; background:rgba(124,140,248,.08); font-size:13px; }
  .spinner { width:14px; height:14px; border-radius:50%; border:2px solid var(--accent);
          border-top-color:transparent; animation:spin .8s linear infinite; flex:none; }
  @keyframes spin { to { transform:rotate(360deg); } }
  dialog.confirm { border:1px solid var(--border-hi); border-radius:16px; padding:22px 24px;
          background:var(--card); color:var(--text); max-width:min(460px, calc(100vw - 40px));
          box-shadow:0 30px 60px -30px rgba(0,0,0,.9); }
  dialog.confirm::backdrop { background:rgba(5,7,12,.66); }
  dialog.confirm h3 { margin:0 0 8px; font-size:16px; }
  dialog.confirm p { margin:0; font-size:13.5px; color:var(--muted); white-space:pre-wrap;
          overflow-wrap:anywhere; }
  .confirm-actions { display:flex; gap:10px; justify-content:flex-end; }
  .summary section { margin-bottom:18px; }

  const quiet = url === '/api/shutdown';
  let res;
  try {
    res = await fetch(url, { method: 'POST',
      headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  } catch (_e) {
    if (!quiet) showSendError('Could not reach the server — nothing was sent. Check that it is still running and try again.');
    return {};
  }
  // Create-task needs the new id back; every other caller ignores the result,
  // and /api/shutdown dies mid-response, hence the catch.
  const data = await res.json().catch(() => ({}));
  if (!res.ok && !quiet) {
    showSendError(`The server rejected this (${res.status}${data.error ? ': ' + data.error : ''}). Nothing was sent — reload the page and try again.`);
    return {};
  }
  if (!quiet) clearSendError();
  return data;
}
const sendAnswer = payload => postJson('/api/answer', { taskId: activeTask, ...payload });
const currentTask = () => lastState && lastState.tasks.find(t => t.id === activeTask);

// In-page confirmation modal — never window.confirm(): a native dialog freezes the page
// (and any browser automation driving it), cannot be styled and cannot be asserted on.
// Every answer submitted in steps 1-3 goes through it, so one stray click never advances
// the pipeline. Resolves false on Cancel and on Esc.
function askConfirm({ title, text, confirmLabel }) {
  const dlg = $('#confirmDialog');
  $('#confirmTitle').textContent = title;
  $('#confirmText').textContent = text;
  $('#confirmOk').textContent = confirmLabel || 'Confirm';
  dlg.returnValue = '';
  // The panel behind the dialog may re-render while it is open (a new question, a
  // failure). Confirming then would answer something that is no longer on screen.
  const openedAt = lastSig;
  return new Promise(resolve => {
    const onClose = () => {
      dlg.removeEventListener('close', onClose);
      resolve(dlg.returnValue === 'ok' && lastSig === openedAt);
    };
    dlg.addEventListener('close', onClose);
    dlg.showModal();
    $('#confirmCancel').focus();  // Enter must not confirm by accident
  });
}
$('#confirmOk').addEventListener('click', () => $('#confirmDialog').close('ok'));
$('#confirmCancel').addEventListener('click', () => $('#confirmDialog').close('cancel'));

// Instant click feedback: disable every control and show a spinner notice.
// The panel stays locked until the orchestrator changes the state (sig changes).
// `hide` takes the panel's content off the screen too, for a decision that leaves nothing
// on it to read - Finish, on a failure the user has given up on.
function lockPanel(message, remember = true, hide = false) {
  if (remember) {
    const v = viewOf(activeTask);
    v.locked = message;
    v.lockedSig = lastSig;
    v.lockedHide = hide;
  }
  document.querySelectorAll('#panel button, #panel textarea, #panel input, #panel select')
    .forEach(el => { el.disabled = true; });
  if (hide) [...$('#panel').children].forEach(el => { el.style.display = 'none'; });
  const n = document.createElement('div');
  n.className = 'notice';
  const spin = document.createElement('span');
  spin.className = 'spinner';
  const txt = document.createElement('span');
  txt.textContent = message;
  n.append(spin, txt);
  $('#panel').appendChild(n);
}

// Textareas grow with their content up to 45vh, then scroll — a pasted wall of
// text must never push the panel's buttons off screen.
function autoGrow(el) {
  el.style.height = 'auto';
  const border = el.offsetHeight - el.clientHeight;
  const max = Math.round(window.innerHeight * ((Number(el.dataset.maxVh) || 45) / 100));
  const want = el.scrollHeight + border;
  el.style.height = `${Math.min(want, max)}px`;
  el.style.overflowY = want > max ? 'auto' : 'hidden';
}

// A decorator rather than a change in every render function: every step's text
// fields get a copy button, including any field added later. Password fields opt
// out with data-no-copy, because revealing one flips its type to text.
function wireCopyButtons() {
  document.querySelectorAll('#panel textarea, #panel input[type=text]').forEach(el => {
    if (el.dataset.copyWired || el.dataset.noCopy) return;
    el.dataset.copyWired = '1';
    const wrap = document.createElement('div');
    wrap.className = 'copy-wrap';
    el.parentNode.insertBefore(wrap, el);
    wrap.appendChild(el);
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'copy';
    btn.innerHTML = COPY_ICON;
    btn.title = 'Copy field content';
    btn.setAttribute('aria-label', 'Copy field content');
    btn.addEventListener('click', async () => {
      await copyText(el.value);
      btn.innerHTML = CHECK_ICON;
      setTimeout(() => { btn.innerHTML = COPY_ICON; }, 2000);
    });
    wrap.appendChild(btn);
  });
}

function wireTextareas() {
  document.querySelectorAll('#panel textarea').forEach(el => {
    if (!el.dataset.autogrow) {
      el.dataset.autogrow = '1';
      el.addEventListener('input', () => autoGrow(el));
    }
    autoGrow(el);
  });
}

// A drag fires resize dozens of times a second and each pass forces a layout per
// textarea, so coalesce them into one measurement per frame.
let resizePending = false;
window.addEventListener('resize', () => {
  if (resizePending) return;
  resizePending = true;
  requestAnimationFrame(() => {
    resizePending = false;
    wireTextareas();
  });
});

async function tick() {
  if (serverDown) return;
  const seq = ++pollSeq;
  let state;
  try {
    state = await (await fetch('/api/state')).json();
  } catch (_e) {
    $('#panel').innerHTML = '<p class="muted">Server unreachable — retrying…</p>';
    lastSig = null;
    return;
  }
  if (seq < drawnSeq) return;
  drawnSeq = seq;
  if (!activeTask || !state.tasks.some(t => t.id === activeTask)) {
    activeTask = state.tasks[0].id;
    lastSig = null;
  }
  lastState = state;
  const taken = state.tasks.map(t => `${t.id}=${t.branch}`).join(',');
  if (taken !== takenBranches) {
    takenBranches = taken;
    if (refreshGate) refreshGate();
  }
  const task = state.tasks.find(t => t.id === activeTask);
  renderUsage((state.usage || {})[activeTask], (state.orchestrators || {})[activeTask], task);
  renderTabs(state);
  renderStepper(task);
  renderViewBar(task);
  renderPanel(state, task);
}

// The active task's orchestrator - every task has a Claude Code session of its own - and that
// session's own numbers, as its status line last reported them (usage.cjs): what it has spent,
// how much of the 5-hour and the weekly limit that is, what it runs on and how full its context
// is. Drawn again only when one of them moved; the tooltips say the rest.
const compact = n => (n == null ? '—' : n >= 1e6 ? `${(n / 1e6).toFixed(n >= 1e7 ? 1 : 2)}M`
  : n >= 1e3 ? `${Math.round(n / 1e3)}k` : String(n));
const grouped = n => (n == null ? '—' : Number(n).toLocaleString('en-US'));
const pctText = p => (p == null ? '—' : `${Math.round(p)}%`);
function resetsText(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const day = d.toDateString() === new Date().toDateString() ? ''
    : `${d.toLocaleDateString('en-US', { weekday: 'short' })} `;
  return ` · resets ${day}${d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })}`;
}
const ORCHESTRATOR_STATUS = {
  starting: ['starting…', 'A terminal was opened for this task; its session has not polled for answers yet.'],
  listening: ['listening', 'This task\'s session is waiting for an answer from this page.'],
  working: ['working', 'This task\'s session is at work and will pick up answers when it is done.'],
  closed: ['closed', 'This task\'s session stopped listening - its terminal was closed, or it has not '
    + 'been heard from for 15 minutes. Answers wait here until a session takes the task.'],
  none: ['none', 'No session runs this task yet. Answers wait here until one takes the task.'],
};
function orchestratorChips(o) {
  const [text, why] = ORCHESTRATOR_STATUS[o.status] || ORCHESTRATOR_STATUS.none;
  const title = `${why}${o.launchError ? `\nThe last terminal did not open: ${o.launchError}` : ''}`;
  const status = `<span class="chip" id="orchestratorStatus" title="${esc(title)}"><span
    class="dot ${esc(o.status)}"></span><span class="k">Orchestrator</span><b>${esc(text)}</b></span>`;
  return ['closed', 'none'].includes(o.status)
    ? `${status}<button type="button" class="chip" id="openSession" title="${esc('Opens a terminal in the '
      + 'project with a Claude Code session of its own for this task')}">Open session</button>`
    : status;
}
function renderUsage(u, o, task) {
  const box = $('#usage');
  // A task whose form was never sent has nothing for a session to do yet.
  const orch = o && (o.status !== 'none' || (task && task.step1Submitted)) ? o : null;
  const sigNow = JSON.stringify([u || null, orch]);
  if (!box || box.dataset.sig === sigNow) return;
  box.dataset.sig = sigNow;
  box.hidden = !u && !orch;
  if (box.hidden) return;
  const head = orch ? orchestratorChips(orch) : '';
  if (!u) {
    box.innerHTML = head;
    return;
  }
  const asOf = u.asOf ? `\nAs of ${new Date(u.asOf).toLocaleTimeString('en-GB')}, from the orchestrator's status line` : '';
  // A level meter only where there is a limit to reach: amber from 70%, red from 90%.
  const chip = (label, value, title, pct) => `<span class="chip" title="${esc(title + asOf)}"><span
    class="k">${esc(label)}</span><b>${esc(value)}</b>${pct == null ? '' : `<span class="meter"><span${
    pct >= 90 ? ' class="hot"' : pct >= 70 ? ' class="warm"' : ''} style="width:${
    Math.max(3, Math.min(100, Math.round(pct)))}%"></span></span>`}</span>`;
  const effort = u.effort ? chip('Effort', u.effort, 'The orchestrator\'s thinking effort') : '';
  if (!u.relay) {
    box.innerHTML = `${head}${effort}<span class="chip off" title="${esc('Only the status line is told the '
      + 'session\'s usage. Set statusLine.command in ~/.claude/settings.json to\nnode "'
      + `${u.relayScript || 'statusline-relay.cjs'}" <your status line command>\nand the numbers `
      + 'show up here on its next update.')}">Usage: connect the status line</span>`;
    return;
  }
  const t = u.tokens || {};
  const total = t.input == null && t.output == null ? null : (t.input || 0) + (t.output || 0);
  const limit = (label, name, l) => chip(label, pctText(l && l.usedPct),
    l ? `${name}: ${pctText(l.usedPct)} used${resetsText(l.resetsAt)}` : `${name}: not reported`,
    l && l.usedPct);
  const c = u.context || {};
  box.innerHTML = [
    head,
    chip('Tokens', compact(total), `This session: ${grouped(t.input)} input · ${grouped(t.output)} output${
      u.costUsd != null ? ` · $${u.costUsd.toFixed(2)} at API prices` : ''}`),
    limit('5h', 'The 5-hour limit', u.fiveHour),
    limit('Week', 'The weekly limit', u.weekly),
    chip('Model', u.model || '—', 'The orchestrator\'s model'),
    effort || chip('Effort', '—', 'The orchestrator\'s thinking effort'),
    chip('Context', pctText(c.usedPct), c.size
      ? `${grouped(c.used)} of ${grouped(c.size)} tokens in the context window` : 'The context window',
    c.usedPct),
  ].join('');
}

// The server opens the session (POST /api/orchestrator/launch): it knows the project and the
// port. Where it opens no terminal, the dialog gives the command to run in one.
async function openSession() {
  const btn = $('#openSession');
  if (btn) btn.disabled = true;
  const r = await postJson('/api/orchestrator/launch', { taskId: activeTask });
  if (r.launched === false) showSessionCommand(r);
  // The chip is drawn anew either way: the status moves on, or the button comes back.
  $('#usage').dataset.sig = '';
  tick();
}
function showSessionCommand(r) {
  $('#sessionWhy').textContent = `No terminal could be opened from here${r.error ? ` (${r.error})` : ''}. `
    + 'Run this in a terminal of your own:';
  $('#sessionCommand').textContent = r.command;
  $('#sessionCwd').textContent = r.cwd ? `in the project directory, ${r.cwd}` : '';
  $('#sessionCopy').textContent = 'Copy command';
  $('#sessionDialog').showModal();
}
$('#usage').addEventListener('click', e => {
  if (e.target.closest('#openSession')) openSession();
});
$('#sessionCopy').addEventListener('click', async () => {
  await copyText($('#sessionCommand').textContent);
  $('#sessionCopy').textContent = 'Copied';
});
$('#sessionClose').addEventListener('click', () => $('#sessionDialog').close());

// Rebuilt every tick like the stepper — the bar holds no input, so a background
// task changing state never re-renders (and never clears) the open panel.
function renderTabs(state) {
  const box = $('#tabs');
  if (state.tasks.length < 2) {
    box.hidden = true;
    box.innerHTML = '';
    box.dataset.sig = '';
    return;
  }
  // Same reason as the stepper: only redraw when a tab actually changed, or the
  // rebuild would steal focus from a tab the user is on every single second.
  const sigNow = tabsSig(state);
  box.hidden = false;
  if (box.dataset.sig === sigNow) return;
  box.dataset.sig = sigNow;
  // The close control is a real button, so the tab itself cannot be one — nesting
  // interactive elements is invalid HTML and leaves the × unreachable by keyboard.
  box.innerHTML = state.tasks.map((t, i) => {
    const open = t.id === activeTask;
    // Step 1 in_progress is just an unsubmitted form, so the pipeline has started
    // once the form was submitted — that is what closes the × for good.
    const closable = !t.step1Submitted && t.steps.slice(1).every(s => s.status === 'waiting');
    return `<span class="tab${open ? ' selected' : ''}" role="tab"
      aria-selected="${open}" tabindex="0" data-task="${esc(t.id)}">
      <span class="dot ${activeStepOf(t).status}"></span>
      <span class="label">${esc(tabLabel(t, i))}</span>
      ${pending(t) && !open ? '<span class="pending" title="Waiting for you">●</span>' : ''}
      ${closable ? `<button type="button" class="close" data-close="${esc(t.id)}"
        aria-label="Close task" title="Close task">×</button>` : ''}
    </span>`;
  }).join('');
  box.setAttribute('role', 'tablist');
  box.querySelectorAll('[data-task]').forEach(el => {
    const open = () => {
      if (el.dataset.task === activeTask) return;
      snapshotStep1();
      activeTask = el.dataset.task;
      lastSig = null;
      tick();
    };
    el.addEventListener('click', open);
    el.addEventListener('keydown', e => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      e.preventDefault();
      open();
    });
  });
  box.querySelectorAll('[data-close]').forEach(el =>
    el.addEventListener('click', async e => {
      e.stopPropagation();   // the × sits inside the tab button
      const id = el.dataset.close;
      const ok = await askConfirm({ title: 'Close this task?',
        text: 'Its form and uploaded files are deleted. The task has not started yet.',
        confirmLabel: 'Close task' });
      if (!ok) return;
      await postJson('/api/tasks/remove', { taskId: id });
      if (id === activeTask) activeTask = null;
      lastSig = null;
      tick();
    }));
}

const tabsSig = state => state.tasks.map((t, i) => [t.id, tabLabel(t, i),
  activeStepOf(t).status, pending(t) ? '!' : '', t.step1Submitted ? 'S' : '',
  t.steps.slice(1).every(s => s.status === 'waiting') ? 'w' : '',
  t.id === activeTask ? '*' : ''].join(':')).join(',');

// A tab is named by whatever branch its form holds — the draft while it is being
// typed, the submitted value afterwards. Reading the live input instead would tie
// the bar's signature to the DOM the input handler patches, and the bar would
// rebuild on every keystroke, detaching the tabs under the user's cursor.
function tabLabel(task, i) {
  const draft = viewOf(task.id).draft;
  const typed = draft && String(draft.branch || '').trim();
  return typed || task.branch || `Task ${i + 1}`;
}

// Patch the open tab's label in place and keep the bar's signature in step, so
// typing a branch never triggers a rebuild.
function syncTabLabel() {
  const box = $('#tabs');
  if (!box || box.hidden || !lastState) return;
  const i = lastState.tasks.findIndex(t => t.id === activeTask);
  const label = box.querySelector(`.tab[data-task="${activeTask}"] .label`);
  if (i === -1 || !label) return;
  label.textContent = tabLabel(lastState.tasks[i], i);
  box.dataset.sig = tabsSig(lastState);
}

// Step ids are fixed, but the tiles follow the order the steps run in (STEP_ORDER),
// a disabled step (one whose switch on the form is off) is hidden, and the visible
// ones are numbered 1..n so the badges stay contiguous.
const orderOf = task => (Array.isArray(task.route)
  ? [...task.route, ...STEP_ORDER.filter(id => !task.route.includes(id))] : STEP_ORDER);
const rankOf = (id, order = STEP_ORDER) => (order.includes(id) ? order.indexOf(id) : order.length + id);
const shownSteps = task => {
  const order = orderOf(task);
  return task.steps.filter(s => s.enabled !== false).sort((a, b) => rankOf(a.id, order) - rankOf(b.id, order));
};
function renderStepper(task) {
  // Rebuilding innerHTML every second would drop focus and restart the pulse
  // animation, so the tiles are redrawn only when something about them changed.
  const viewed = viewedStep(task);
  const sigNow = [task.id, viewed.id, shownSteps(task)
    .map(s => `${s.id}:${s.status}`).join(',')].join('|');
  const box = $('#stepper');
  if (box.dataset.sig === sigNow) return;
  box.dataset.sig = sigNow;
  box.innerHTML = shownSteps(task).map((s, i) => {
    const name = esc(s.name || STEP_NAMES[s.id - 1]);
    const nav = visitable(s);
    return `
    <div class="step ${s.status}${nav ? ' clickable' : ''}${s.id === viewed.id ? ' viewing' : ''}"
      data-step="${s.id}"${nav ? ` role="button" tabindex="0" aria-label="Go to ${name}"` : ''}>
      <span class="num">${i + 1}</span>
      <span class="name">${name}</span>
      <span class="badge">${BADGE[s.status] || s.status}</span>
    </div>`;
  }).join('');
  box.querySelectorAll('.step.clickable').forEach(el => {
    const go = () => gotoStep(+el.dataset.step);
    el.addEventListener('click', go);
    el.addEventListener('keydown', e => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      e.preventDefault();
      go();
    });
  });
}

const activeStepOf = task =>
  task.steps.find(s => s.id === task.activeStep) || task.steps[0];

// A step the pipeline has already opened can be revisited; one it never reached
// has no panel to show. A step whose switch is off stays unreachable.
const visitable = step => step.enabled !== false && step.status !== 'waiting';

// The step whose panel is on screen: the user's own pick while it still holds,
// otherwise wherever the pipeline is.
function viewedStep(task) {
  const v = viewOf(task.id);
  const picked = v.viewStep && task.steps.find(s => s.id === v.viewStep);
  if (picked && visitable(picked)) return picked;
  v.viewStep = null;
  return activeStepOf(task);
}

// Navigation is page state and nothing else: no answer is posted, so neither the
// orchestrator nor any agent learns that the user looked at another step.
function gotoStep(id) {
  const task = currentTask();
  if (!task) return;
  const v = viewOf(task.id);
  snapshotStep1();
  // Step 7's panel and the summary share the screen — picking the tile means the panel.
  if (id === MOCKOON_STEP) v.showSummary = false;
  // Clicking the step the pipeline is on hands the view back to it; with a summary
  // on screen every tile is a pick, because the summary is what following means.
  v.viewStep = id === task.activeStep && !task.summary ? null : id;
  lastSig = null;
  tick();
}

// Only while the user is off the pipeline's own step — it is the way back.
function renderViewBar(task) {
  const box = $('#viewbar');
  const v = viewOf(task.id);
  const viewed = viewedStep(task);
  const followed = task.summary ? null : activeStepOf(task);
  const name = s => esc(s.name || STEP_NAMES[s.id - 1]);
  const sigNow = v.viewStep == null ? ''
    : [task.id, viewed.id, followed ? followed.id : 'S', pending(task) ? '!' : ''].join('|');
  if (box.dataset.sig === sigNow) return;
  box.dataset.sig = sigNow;
  if (v.viewStep == null) {
    box.hidden = true;
    box.innerHTML = '';
    return;
  }
  box.hidden = false;
  box.innerHTML = `<span>Viewing <b>${name(viewed)}</b> — ${followed
    ? `the pipeline is on <b>${name(followed)}</b>${
      pending(task) ? ' and is waiting for you' : ''}.`
    : 'the pipeline has finished.'}</span>
    <button id="goCurrent" class="secondary">${
  followed ? 'Go to current' : 'Back to summary'}</button>`;
  $('#goCurrent').addEventListener('click', () => {
    v.viewStep = null;
    if (task.summary) v.showSummary = true;
    lastSig = null;
    tick();
  });
}

// A review the user sent feedback to stays in the state for the agent's next round, marked
// `answered` by the server - and off the screen: the user has said what they had to say.
const gateOpen = gate => !!gate && !gate.answered;

// A task waiting for the user rather than for an agent: stopped at a gate, or with an
// agent the user stopped and has not yet told how to go on.
const pending = task => !!(task.question || gateOpen(task.reviewSummary) || gateOpen(task.mockupReview))
  || task.steps.some(s => s.stopped);

// Whether this step is the one the pipeline is on — so its buttons answer something
// and its composer reaches an agent. Step 7 is the exception on the summary test: its
// gate opens after the summary is written.
const liveOf = (task, step) =>
  step.id === task.activeStep && (step.id === MOCKOON_STEP || !task.summary);

// The gate the step on screen holds open for the user, if any. A question belongs to whatever
// step is running. The plan and the story are approved at the same gate, on whichever of the
// two steps the pipeline is on - a story gate must not show up on the finished refinement.
// The mockups are step 3's.
function gateOf(task, step) {
  const live = liveOf(task, step);
  if (task.question && live) return 'question';
  if ((step.id === 2 || step.id === STORY_STEP) && gateOpen(task.reviewSummary) && live) return 'review';
  if (step.id === 3 && gateOpen(task.mockupReview)) return 'mockup';
  return null;
}

function sig(task) {
  const v = viewOf(task.id);
  const step = viewedStep(task);
  const mockoon = task.steps.find(s => s.id === MOCKOON_STEP);
  return [task.id, step.id, task.activeStep, step.status,
    task.question ? `q${task.questionSeq || 0}` : '',
    // rev changes on every agent round, so a revised plan replaces the one on
    // screen instead of leaving stale text under a gate the user is answering.
    // An answered gate is a different screen - the step without it - and so is one reopened.
    task.reviewSummary ? `r${task.reviewSummary.rev || 0}${task.reviewSummary.answered ? 'a' : ''}` : '',
    // Same for the mockups.
    task.mockupReview ? `m${task.mockupReview.rev || 0}${task.mockupReview.answered ? 'a' : ''}` : '',
    task.summary ? '1' : '',
    // The Mockoon step changes status while the summary is the visible screen,
    // and the switch between the two screens is local — both must re-render.
    mockoon ? mockoon.status : '', v.showSummary ? 'S' : '',
    // Stepping off the pipeline's own step is a different screen, and so is coming back.
    v.viewStep == null ? '' : 'V'].join('|');
}

function renderPanel(state, task) {
  const v = viewOf(task.id);
  const mockoon = task.steps.find(s => s.id === MOCKOON_STEP);
  // A fresh Mockoon run always pulls the user back onto its panel, whatever they
  // were looking at when they asked for it.
  if (mockoon && mockoon.status === 'in_progress') {
    v.showSummary = false;
    v.viewStep = null;
  }
  const s = sig(task);
  const step = viewedStep(task);
  if (s === lastSig) { updateDynamic(task, step); return; }
  lastSig = s;
  renderActive(task, step);
  wireCopyButtons();
  wireTextareas();
  // The orchestrator has not moved this task since the answer went out, so the
  // panel goes back under its lock instead of offering the button again.
  if (v.locked && v.lockedSig === s) lockPanel(v.locked, false, v.lockedHide);
  else { v.locked = null; v.lockedSig = null; v.lockedHide = false; }
}

function renderActive(task, step) {
  refreshGate = null;
  refreshRuns = null;
  const v = viewOf(task.id);
  // A gate only answers while the orchestrator is actually waiting at it, so a
  // step revisited after the fact shows its panel without its buttons. Step 7 is
  // the exception on the summary test: its gate opens after the summary is written.
  const live = liveOf(task, step);
  // Mockoon mocks are generated after the pipeline is over, so while step 7 is the
  // one on screen its panel outranks the summary — until the user asks to go back.
  if (step.id === MOCKOON_STEP && !v.showSummary) {
    return step.status === 'failed' ? renderFailed(step, live) : renderMockoon(task, step);
  }
  // The summary is what following the pipeline means once it is written; a step
  // the user picked for themselves outranks it.
  if (task.summary && v.viewStep == null) return renderSummary(task);
  if (step.status === 'failed') return renderFailed(step, live);
  // A question carries no step of its own — it belongs to whatever step is running.
  if (gateOf(task, step) === 'question') return renderQuestion(task, task.question, step);
  if (step.id === 1) return renderStep1(task);
  if (gateOf(task, step) === 'review') return renderReview(task, task.reviewSummary, step);
  if (gateOf(task, step) === 'mockup') return renderMockupReview(task.mockupReview, step);
  if (step.id === STORY_STEP && step.status === 'completed') return renderStory(task, step);
  renderProgress(task, step);
}

function renderStep1(task) {

    btn.addEventListener('click', async () => {
      btn.disabled = true;
      await postJson('/api/upload/remove',
        { taskId: activeTask, category: btn.dataset.cat, filename: btn.dataset.name });
      if (revisit) v.filesDirty = true;
      lastSig = null;
      tick();
    }));
  // The flag list can land after the form, and a run can be added or removed: each one
  // redraws the cards from what is on screen, so no tick is lost on the way.
  // Two run editors of one shape: the review after implementation, and the final review.
  const editors = [{ box: '#reviewRuns', add: '#addRun', what: '' }, { box: '#finalRuns', add: '#addFinalRun', what: 'final ' }];
  const drawRuns = (list, ed = editors[0]) => {

  const wireRuns = ed => {
    $(ed.add).disabled = finished || runsOnScreen(ed.box).length >= reviewRunsMax;

        .forEach(el => { el.disabled = true; });

  // Walking back to the form to re-read it is free; re-running refinement is not,
  // so a resubmission has to carry something the agents have not seen. What the task
  // is and how it is run are told apart, because only the first repeats anything.
  const flowEdited = () => {
    if (v.filesDirty || STEP1_FILES.some(cat => pickedOf(cat).length)) return true;
    const prev = task.step1 || {};

      && same('#branch', 'branch') && same('#contractsText', 'contractsText')

    const taken = (lastState ? lastState.tasks : [])
      .some(t => t.id !== task.id && t.branch && t.branch === branch);

      : !branchOk(branch) ? 'Not a valid git branch name.'

    const valid = !!($('#task').value.trim()
      && branchOk(branch) && !taken && $('#commitMessage').value.trim()
      && (a.complete || (!a.login && !a.password.trim())));

    $('#changeHint').hidden = !(valid && !dirty);
  };

  // the panel, and only what was put away survives it.
  const onEdit = () => { snapshotStep1(); gate(); };

  ['#refinement', '#genMockups', '#storyDesc']

  $('#rememberAuth').addEventListener('change', () => {

  $('#branch').addEventListener('input', syncTabLabel);

    // What runs next depends on the switches, and with all three off the next step is

      : $('#genMockups').checked ? 'Mockups start: an agent designs the screens from this form.'

            + 'implementation starts.'

    const uploaded = {};

      if (!uploaded[cat]) return giveBack();
