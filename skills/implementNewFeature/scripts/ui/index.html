    const sent = await sendAnswer({ kind: 'step1',
      taskDescription: $('#task').value.trim(),
      branch: $('#branch').value.trim(),
      contractsText: $('#contractsText').value.trim(),
      hintsNote: $('#hintsNote').value.trim(),
      mockups: keep('mockups'), contracts: keep('contracts'), hints: keep('hints'),
      images: keep('images'),
      authProvided: a.complete || task.authSaved,
      refinement: $('#refinement').checked,
      generateMockups: $('#genMockups').checked,
      storyDescription: $('#storyDesc').checked,
      codeReview: runsOnScreen(),
      commitMessage: $('#commitMessage').value.trim(),
      finalReview: $('#finalReview').checked,
      finalCodeReview: runsOnScreen('#finalRuns'),
      agents: agentsOnScreen() });
    if (!sent.ok) return giveBack();
    // The form is the server's now, credentials included — nothing of it stays on
    // the page, or the next redraw would hand back files that were already uploaded.
    STEP1_FILES.forEach(cat => pickedOf(cat).forEach(dropFileUrl));
    v.draft = null;
    v.picked = null;
    v.filesDirty = false;
    // Submitting means "go", so the view rejoins the pipeline wherever it now is. On a
    // resubmission the server has already moved it - back to the first step that repeats,
    // the ones after it waiting again, or nowhere when nothing does - so the page follows
    // at once instead of on the next poll.
    v.viewStep = null;
    lastSig = null;
    tick();
  });
}

// A shortcut to the stepper's own first tile, offered on the interactive
// gates. It only changes what is on screen: the gate stays open, the agents hear
// nothing, and the switched-on steps before implementation re-run only if the form
// comes back actually changed.
const backButton = () => '<button id="backToStep1" class="secondary">Back to requirements</button>';

function wireBackButton() {
  const btn = $('#backToStep1');
  if (!btn) return;
  btn.addEventListener('click', () => gotoStep(1));
}

// A line of a conversation, with the pictures that went with it. A line of the user's own
// in a step's live transcript carries the × that deletes it. A line keeps its white space
// (pre-wrap), so the markup breaks only inside tags - between them it would show.
const msgHtml = (role, text, attachments, id, deletable) =>
  `<div class="msg ${role === 'user' ? 'user' : 'agent'}"${id != null ? ` data-id="${id}"` : ''}><span
    class="who">${role === 'user' ? 'You' : 'Agent'}</span>${
  deletable && role === 'user' && id != null ? `<button type="button" class="rm" data-delete="${id}"
    aria-label="Delete this message" title="Delete this message">×</button>` : ''}${esc(text)}${
  (attachments || []).length ? `<div class="thumbs">${attachments.map(n =>
    thumbHtml(uploadUrl(ATTACHMENTS, n), n)).join('')}</div>` : ''}</div>`;

// The pictures that go with a message, on the three steps before implementation: picked
// into a tray above the field, kept with the draft so a redraw hands them back, and
// uploaded only when the message goes out.
const attachButton = key => `<button type="button" class="secondary attach-btn"
    data-attach="${key}" aria-label="Attach images" title="Attach images">${CLIP_ICON}</button>
  <input type="file" accept="image/*" multiple hidden data-attach-input="${key}">`;
const attachTray = key => `<div class="thumbs" data-attach-tray="${key}"></div>`;
const attachedOf = key => viewOf(activeTask).attach[key] || [];

// Wires one picker and its tray. Returns what a send calls first: it uploads the tray
// and resolves to the stored names - or to null when an upload failed, and then the
// message is not sent at all, so its text and pictures stay where they are. `onChange`
// hears of every picture picked or removed - a Send may wait on one.
function wireAttach(key, onChange) {
  const btn = document.querySelector(`[data-attach="${key}"]`);
  if (!btn) return async () => [];
  const v = viewOf(activeTask);
  const input = document.querySelector(`[data-attach-input="${key}"]`);
  const tray = document.querySelector(`[data-attach-tray="${key}"]`);
  const draw = () => {
    tray.innerHTML = attachedOf(key).map((f, i) => `<span class="att">${thumbHtml(fileUrl(f), f.name)}
      <button type="button" class="rm" data-detach="${i}" aria-label="Remove ${esc(f.name)}"
        title="Remove">×</button></span>`).join('');
    tray.querySelectorAll('[data-detach]').forEach(x => x.addEventListener('click', () => {
      dropFileUrl(attachedOf(key)[+x.dataset.detach]);
      v.attach[key] = attachedOf(key).filter((_, j) => j !== +x.dataset.detach);
      draw();
    }));
    btn.disabled = attachedOf(key).length >= MAX_ATTACHMENTS;
    if (onChange) onChange();
  };
  btn.addEventListener('click', () => input.click());
  input.addEventListener('change', () => {
    const images = [...input.files].filter(f => IMAGE_RE.test(f.name));
    v.attach[key] = [...attachedOf(key), ...images].slice(0, MAX_ATTACHMENTS);
    input.value = '';
    draw();
  });
  draw();
  return async () => {
    const names = [];
    for (const f of attachedOf(key)) {
      const res = await postJson('/api/upload', { taskId: activeTask, category: ATTACHMENTS,
        filename: f.name, dataBase64: await toB64(f) });
      if (!res.ok) return null;
      names.push(res.name);
    }
    attachedOf(key).forEach(dropFileUrl);
    v.attach[key] = [];
    draw();
    return names;
  };
}

// Every agent step can be stopped while it runs. A Stop only interrupts the agent: the
// step keeps its status and its panel, and whatever the user sends it next is what the
// agent goes on with.
const stoppable = step => {
  const task = currentTask();
  return !!task && step.id !== 1 && step.status === 'in_progress' && liveOf(task, step);
};
const STOPPED_NOTE = 'Stopped. The agent is waiting — whatever you send on this step next '
  + 'tells it how to go on.';
// The step's title, with the Stop button beside it while there is something to stop -
// and once it is stopped, the note that says so under the title in the button's place.
const panelHead = (title, step) => {
  const stop = stoppable(step);
  return `<div class="panel-head"><h2>${title}</h2>${stop ? `<button type="button"
    id="stopStep" class="danger"${step.stopped ? ' hidden' : ''}>Stop</button>` : ''}</div>${
  stop ? `<div class="stopped-note" id="stoppedNote"${step.stopped ? '' : ' hidden'}>${
    STOPPED_NOTE}</div>` : ''}`;
};
function wireStop(step) {
  const btn = $('#stopStep');
  if (!btn) return;
  btn.addEventListener('click', async () => {
    const ok = await askConfirm({ title: 'Stop the agent?',
      text: 'It stops what it is doing right now, and the step stays as it is. Whatever you '
        + 'send on this step next tells the agent how to go on.',
      confirmLabel: 'Stop the agent' });
    if (!ok) return;
    btn.disabled = true;
    if (!(await sendAnswer({ kind: 'stop', step: step.id })).ok) btn.disabled = false;
    tick();
  });
}
// The Stop button and its note trade places as the flag comes and goes, without a
// redraw - a Stop leaves the panel as it was, and so does the message that resumes it.
function updateStopped(step) {
  const note = $('#stoppedNote');
  const btn = $('#stopStep');
  if (!note || !btn || note.hidden === !step.stopped) return;
  note.hidden = !step.stopped;
  btn.hidden = !!step.stopped;
  btn.disabled = false;
}

// What belongs to the panel on screen rather than to the task: the answer still half-typed
// in it and the pictures picked for it. A tab switch, a walk back to the requirements and
// a poll all redraw the same panel — same signature — and both have to come back. A new
// question or a revised plan is a different panel, and starts empty, because neither would
// still be an answer to what is being asked.
function panelView() {
  const v = viewOf(activeTask);
  if (v.draftSig !== lastSig) {
    v.answerDraft = '';
    (v.attach.answer || []).forEach(dropFileUrl);
    v.attach.answer = [];
    v.draftSig = lastSig;
  }
  return v;
}

// A Send is offered only for something to send: typed text, or a picture in the tray.
// Returns the check, for what changes either without an input event - a send emptying
// the field, a picture picked or removed.
function wireSendable(field, button, key) {
  const sync = () => {
    button.disabled = field.disabled || (!field.value.trim() && !attachedOf(key).length);
  };
  field.addEventListener('input', sync);
  sync();
  return sync;
}

// A send in flight. The controls it went from wait for the server, so a second click
// cannot send it twice, and a send that failed hands them back with its text still in
// them. A gate is the server's to take down - it does so as it records the answer - so
// the poll run right away redraws the panel without it, not one round of the agent later.
async function sendFrom(scope, send, sync) {
  const controls = [...document.querySelectorAll(`${scope} button, ${scope} textarea, ${scope} input`)]
    .filter(el => !el.disabled);
  controls.forEach(el => { el.disabled = true; });
  const ok = await send();
  if (ok) await tick();
  controls.forEach(el => { el.disabled = false; });
  if (sync) sync();
  return ok;
}

// The step's bar and the operation under it, both kept current by updateDynamic.
const progressBar = () => `<div class="bar"><div id="barFill"></div></div>
    <div class="op" id="op"></div>`;

// The composer of a gate that takes free text: what is typed stays with the panel
// until it is sent, so a redraw hands it straight back.
function wireComposer(sel) {
  const v = panelView();
  const el = $(sel);
  el.value = v.answerDraft || '';
  el.addEventListener('input', () => { v.answerDraft = el.value; });
  // Called once the text is on its way out: the box and the draft empty together.
  return () => {
    el.value = '';
    v.answerDraft = '';
    autoGrow(el);
  };
}

// The question goes over the step's own progress, log and transcript, not in their place:
// what the agent was doing when it asked is half of what the question means.
function renderQuestion(task, q, step) {
  // Steps 1-3 are the interactive ones — there an answer is confirmed before it is sent.
  // Step 5 only asks to retry the Chrome extension, which needs no gate.
  const confirmFirst = step.id <= 3;
  const pictures = ATTACH_STEPS.includes(step.id);
  const opts = (q.options || []).map((o, i) =>
    `<button data-opt="${i}">${esc(o)}</button>`).join('');
  $('#panel').innerHTML = `
    ${panelHead(esc(step.name || STEP_NAMES[step.id - 1]), step)}
    ${progressBar()}
    <div class="gate-card" id="gate">
      <div class="gate-label">The agent asks</div>
      <p class="gate-question">${esc(q.text)}</p>
      <div class="options">${opts}</div>
      <label>…or type your own answer</label>
      <textarea id="freeAnswer"></textarea>
      ${pictures ? attachTray('answer') : ''}
      <div class="gate-actions">
        <button id="send">Send answer</button>
        ${pictures ? attachButton('answer') : ''}
        ${step.id === 2 ? backButton() : ''}
      </div>
    </div>
    <ul class="log" id="log"></ul>
    ${chatBox(step, true)}`;
  // The composer first: it is what starts a new panel with an empty tray.
  const clearAnswer = wireComposer('#freeAnswer');
  const sync = wireSendable($('#freeAnswer'), $('#send'), 'answer');
  const takeAttachments = wireAttach('answer', sync);
  // One answer per question: the server takes the question down as it records the answer,
  // and a second thought goes to the agent as a message, from the step's own composer.
  const submit = async (value, after) => {
    const count = attachedOf('answer').length;
    if (confirmFirst && !await askConfirm({ title: 'Send this answer?',
      text: [value, count ? `+ ${count} attached image${count > 1 ? 's' : ''}` : '']
        .filter(Boolean).join('\n\n'),
      confirmLabel: 'Send answer' })) return;
    await sendFrom('#gate', async () => {
      const attachments = await takeAttachments();
      if (!attachments) return false;
      const ok = !!(await sendAnswer({ kind: 'answer', questionId: q.id, value, attachments })).ok;
      if (ok && after) after();
      return ok;
    }, sync);
  };
  document.querySelectorAll('[data-opt]').forEach(btn =>
    btn.addEventListener('click', () =>
      submit(q.options[+btn.dataset.opt], () => btn.classList.add('selected'))));
  $('#send').addEventListener('click', () => {
    const value = $('#freeAnswer').value.trim();
    if (!value && !attachedOf('answer').length) return;
    submit(value, clearAnswer);
  });
  wireBackButton();
  wireStop(step);
  wireDelete(step);
  updateDynamic(task, step);
}

// What the refinement wants read before its plan is approved - risks, caveats, a choice the
// implementer must not get wrong - in a list of its own above the summary, where an Approve
// cannot pass it by. A result without any, or an older one that kept them in its summary,
// shows the summary alone.
const criticalOf = review => (Array.isArray(review.critical) ? review.critical
  : typeof review.critical === 'string' ? [review.critical] : [])
  .map(c => String(c).trim()).filter(Boolean);

// The plan gate shows the refinement's summary; the story gate shows the story itself,
// read from the task dir, with the agent's summary above it. Both go over the step's
// progress, log and transcript, like a question.
function renderReview(task, review, step) {
  const story = step.id === STORY_STEP;
  const critical = criticalOf(review);
  $('#panel').innerHTML = `
    ${panelHead(story ? 'Story review' : 'Plan review', step)}
    ${progressBar()}
    <div class="gate-card" id="gate">
      ${critical.length ? `<div class="critical"><h3>Critical information</h3>
        <ul>${critical.map(c => `<li>${esc(c)}</li>`).join('')}</ul></div>` : ''}
      ${story ? `<p class="muted">${esc(review.text)}</p>
      <pre class="report" id="storyText">Loading…</pre>
      <div class="gate-actions">
        <button id="approve">Approve</button>
        <button id="copyStory" class="secondary" disabled>Copy story</button>
      </div>` : `<pre class="summary-text">${esc(review.text)}</pre>
      <button id="approve">Approve</button>`}
      <label>…or request changes</label>
      <textarea id="feedback"></textarea>
      ${attachTray('answer')}
      <div class="gate-actions">
        <button id="sendFeedback" class="secondary">Send feedback</button>
        ${attachButton('answer')}
        ${backButton()}
      </div>
    </div>
    <ul class="log" id="log"></ul>
    ${chatBox(step, true)}`;
  const clearFeedback = wireComposer('#feedback');
  const sync = wireSendable($('#feedback'), $('#sendFeedback'), 'answer');
  const takeAttachments = wireAttach('answer', sync);
  wireStop(step);
  // The server takes the gate down as it records the approval, so what the poll draws next
  // is the step moving on - not this panel under a lock until the orchestrator gets round.
  $('#approve').addEventListener('click', async () => {
    const ok = await askConfirm({
      title: story ? 'Approve the story?' : 'Approve the plan?',
      text: story ? 'Implementation starts right away and agents begin changing files in your project.'
        : 'The next step starts right away and agents begin changing files in your project.',
      confirmLabel: 'Approve and continue' });
    if (!ok) return;
    sendFrom('#gate', async () => !!(await sendAnswer({ kind: 'decision', decision: 'approve' })).ok, sync);
  });
  // Feedback takes the gate down too, until the agent's next round puts up what it revised;
  // the transcript under it keeps what was asked for.
  $('#sendFeedback').addEventListener('click', () => {
    const t = $('#feedback').value.trim();
    if (!t && !attachedOf('answer').length) return;
    sendFrom('#gate', async () => {
      const attachments = await takeAttachments();
      if (!attachments) return false;
      const ok = !!(await sendAnswer({ kind: 'decision', decision: 'feedback', text: t, attachments })).ok;
      if (ok) clearFeedback();
      return ok;
    }, sync);
  });
  wireBackButton();
  wireDelete(step);
  if (story) loadStory();
  updateDynamic(task, step);
}

// One file renders every state of its view, and the fragment - the state's id - picks
// the one on screen.
function mockupUrl(review, screen) {
  return `/generated-mockups/${encodeURIComponent(activeTask)}/${
    encodeURIComponent(screen.file)}?rev=${review.rev || 0}${
    screen.id ? `#${encodeURIComponent(screen.id)}` : ''}`;
}

// Screens numbered <view>.<state> - 0.0, 0.1, 1.0 - are grouped by view, so a dozen states
// of three views read as three tabs and a row of states. A screen from a manifest
// without the numbering is a view of its own.
const screenKey = s => String(s.id || s.file);
function mockupViews(screens) {
  const views = [];
  screens.forEach((s, i) => {
    const m = /^(\d+)\.\d+$/.exec(String(s.id || ''));
    const key = m ? m[1] : `#${i}`;
    let view = views.find(g => g.key === key);
    if (!view) {
      view = { key, numbered: !!m, screens: [],
        label: [m && m[1], s.view || s.title || s.id || `Screen ${i + 1}`].filter(Boolean).join(' ') };
      views.push(view);
    }
    view.screens.push(s);
  });
  return views;
}

// The screen picked last, else - when the new round dropped it - the first case of its
// view, else the first screen.
function shownScreen(screens) {
  const picked = viewOf(activeTask).mockupScreen;
  const view = String(picked || '').split('.')[0];
  return screens.find(s => screenKey(s) === picked)
    || (picked && screens.find(s => String(s.id || '').split('.')[0] === view))
    || screens[0] || null;
}

// The panel is ~930 px wide, so a 1280 px mockup is scaled down rather than
// letterboxed — otherwise the preview would misreport the layout.
function drawPreview(review) {
  const box = $('#preview');
  const screen = shownScreen(review.screens || []);
  if (!box) return;
  if (!screen) {
    box.innerHTML = '<p class="muted">No screen to preview yet.</p>';
    return;
  }
  const [w, h] = MOCKUP_VIEWPORTS[viewOf(activeTask).mockupViewport];
  const scale = Math.min(1, (box.clientWidth || w) / w);
  const url = mockupUrl(review, screen);
  box.innerHTML = `
    <div class="frame" style="height:${Math.round(h * scale)}px">
      <iframe id="mockupFrame" src="${esc(url)}" sandbox="allow-scripts"
        style="width:${w}px;height:${h}px;transform:scale(${scale})"></iframe>
    </div>
    <p class="hint"><a href="${esc(url)}" target="_blank" rel="noopener">Open in a new tab ↗</a></p>`;
}

function renderMockupReview(review, step) {
  const screens = review.screens || [];
  const v = viewOf(activeTask);
  const views = mockupViews(screens);
  const viewports = Object.keys(MOCKUP_VIEWPORTS).map(vp =>
    `<button data-viewport="${vp}"${vp === v.mockupViewport ? ' class="selected"' : ''}>${
      vp}</button>`).join('');
  $('#panel').innerHTML = `
    ${panelHead('Mockups', step)}
    ${review.text ? `<pre class="summary-text">${esc(review.text)}</pre>` : ''}
    <div class="mockup-bar">
      <div class="tabs" id="viewTabs"></div>
      <div class="tabs">${viewports}</div>
    </div>
    <div class="tabs cases" id="caseTabs"></div>
    <div id="preview"></div>
    ${chatBox(step, liveOf(currentTask(), step))}
    <div class="gate-actions">
      <button id="approveMockup">Approve mockups</button>
      ${screenshotsButton()}
      ${backButton()}
    </div>
    <p class="hint" id="shotsHint" hidden></p>
    <div class="composer">
      ${attachTray('mockup')}
      <textarea id="mockupFeedback" data-max-vh="30" rows="1"
        placeholder="Describe what to change — Ctrl+Enter sends"></textarea>
      ${attachButton('mockup')}
      <button id="sendMockup" class="secondary">Send</button>
    </div>`;
  // Whatever was half-typed when the agent's next round landed.
  $('#mockupFeedback').value = v.mockupDraft || '';
  // A row of views, and under it the cases of the view on screen. Picking a view opens
  // its first case.
  const drawTabs = () => {
    const shown = shownScreen(screens);
    const open = views.find(g => g.screens.includes(shown));
    $('#viewTabs').innerHTML = views.map(g => `<button data-view="${esc(g.key)}"${
      g === open ? ' class="selected"' : ''}>${esc(g.label)}</button>`).join('')
      || '<span class="muted">No screens yet</span>';
    $('#caseTabs').innerHTML = open && open.numbered ? open.screens.map(s =>
      `<button data-screen="${esc(screenKey(s))}"${s === shown ? ' class="selected"' : ''}>${
        esc([s.id, s.title].filter(Boolean).join(' '))}</button>`).join('') : '';
    const pick = key => {
      v.mockupScreen = key;
      drawTabs();
      drawPreview(review);
    };
    document.querySelectorAll('#viewTabs [data-view]').forEach(btn => btn.addEventListener('click',
      () => pick(screenKey(views.find(g => g.key === btn.dataset.view).screens[0]))));
    document.querySelectorAll('#caseTabs [data-screen]').forEach(btn =>
      btn.addEventListener('click', () => pick(btn.dataset.screen)));
  };
  drawTabs();
  document.querySelectorAll('[data-viewport]').forEach(btn =>
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-viewport]')
        .forEach(other => other.classList.toggle('selected', other === btn));
      v.mockupViewport = btn.dataset.viewport;
      drawPreview(review);
    }));
  const sync = wireSendable($('#mockupFeedback'), $('#sendMockup'), 'mockup');
  const takeAttachments = wireAttach('mockup', sync);
  // Feedback takes the mockups down until the agent's next round puts up the new ones: the
  // server marks the gate answered as it records the message, and the poll run right away
  // shows the step at work, with the message in its transcript.
  const send = async () => {
    const el = $('#mockupFeedback');
    const t = el.value.trim();
    if (!t && !attachedOf('mockup').length) return;
    await sendFrom('#panel', async () => {
      const attachments = await takeAttachments();
      if (!attachments) return false;
      const ok = !!(await sendAnswer({ kind: 'mockup', decision: 'feedback', text: t, attachments })).ok;
      if (ok) {
        el.value = '';
        v.mockupDraft = '';
        autoGrow(el);
      }
      return ok;
    }, sync);
  };
  $('#mockupFeedback').addEventListener('input', () => {
    v.mockupDraft = $('#mockupFeedback').value;
  });
  $('#mockupFeedback').addEventListener('keydown', e => {
    if (e.key !== 'Enter' || !(e.ctrlKey || e.metaKey)) return;
    e.preventDefault();
    send();
  });
  $('#sendMockup').addEventListener('click', send);
  $('#approveMockup').addEventListener('click', async () => {
    const ok = await askConfirm({
      title: 'Approve the mockups?',
      text: 'They become the binding UI reference for the implementation and the visual baseline '
        + 'for the E2E comparison. Implementation starts next.',
      confirmLabel: 'Approve and continue' });
    if (!ok) return;
    sendFrom('#panel', async () => !!(await sendAnswer({ kind: 'mockup', decision: 'approve' })).ok, sync);
  });
  wireBackButton();
  wireStop(step);
  wireDelete(step);
  wireScreenshots();
  drawPreview(review);
}

// The PNGs of every mockup round sit on disk next to the mockups, and a page cannot open
// a local folder - the server does, in the system's file manager. Not through postJson:
// "no screenshots yet" is an answer here, not a send that failed.
const screenshotsButton = () =>
  '<button type="button" id="openShots" class="secondary">Open screenshots folder</button>';
function wireScreenshots() {
  const btn = $('#openShots');
  if (!btn) return;
  btn.addEventListener('click', async () => {
    let res = null;
    let data = {};
    try {
      res = await fetch('/api/open-folder', { method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ taskId: activeTask, folder: SCREENSHOT_DIR }) });
      data = await res.json().catch(() => ({}));
    } catch (_e) { /* said below */ }
    const hint = $('#shotsHint');
    if (!hint) return;
    hint.classList.toggle('error', !res || (!res.ok && res.status !== 404));
    hint.textContent = !res ? 'Could not reach the server.'
      : res.status === 404 ? 'No screenshots yet — they are taken after every round of mockups.'
        : res.ok ? `Opened ${data.path || 'the folder'} in the file manager.`
          : `Could not open the folder (${data.error || res.status}).`;
    hint.hidden = false;
  });
}

const chatHtml = (msgs, live) =>
  msgs.map(m => msgHtml(m.role, m.text, m.attachments, m.id, live)).join('');
// A step's transcript. While the step is live, the user's own lines in it can be deleted.
const chatBox = (step, live) => `<div class="chat" id="stepChat"${live ? ' data-live="1"' : ''}>${
  chatHtml(step.chat || [], live)}</div>`;

// Every step's panel carries the conversation with that step's agent. The steps that
// ask something of their own (a question, a plan gate, the mockup review) bring their
// own field and are given the transcript alone; the rest get the composer too — that
// is the only way to say anything to an agent that is already running.
const chatBlock = (step, live) => {
  const pictures = ATTACH_STEPS.includes(step.id);
  return `
  ${chatBox(step, live)}
  ${live ? `<div class="composer">
    ${pictures ? attachTray(`msg${step.id}`) : ''}
    <textarea id="stepMessage" data-max-vh="30" rows="1"
      placeholder="Write to the agent — Ctrl+Enter sends"></textarea>
    ${pictures ? attachButton(`msg${step.id}`) : ''}
    <button id="sendStepMessage" class="secondary">Send</button>
  </div>` : ''}`;
};

// Sending does not lock the panel and does not move the step: the agent keeps working
// and answers in the same transcript, so a second thought can follow the first. Only
// the composer waits for the server, and gets the field back empty once it has the line.
function wireChat(step) {
  wireDelete(step);
  const el = $('#stepMessage');
  if (!el) return;
  const drafts = viewOf(activeTask).msgDrafts;
  const key = `msg${step.id}`;
  el.value = drafts[step.id] || '';
  el.addEventListener('input', () => { drafts[step.id] = el.value; });
  const sync = wireSendable(el, $('#sendStepMessage'), key);
  const takeAttachments = wireAttach(key, sync);
  const send = async () => {
    const t = el.value.trim();
    if (!t && !attachedOf(key).length) return;
    // The server records the line as it arrives, so it shows without waiting for
    // the orchestrator to come back round the poll.
    await sendFrom('#panel .composer', async () => {
      const attachments = await takeAttachments();
      if (!attachments) return false;
      const ok = !!(await sendAnswer({ kind: 'message', step: step.id, text: t, attachments })).ok;
      if (ok) {
        el.value = '';
        drafts[step.id] = '';
        autoGrow(el);
      }
      return ok;
    }, sync);
  };
  el.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || !(e.ctrlKey || e.metaKey)) return;
    e.preventDefault();
    send();
  });
  $('#sendStepMessage').addEventListener('click', send);
}

// The × on a line of the user's own. The line leaves the transcript, and the agent is
// told to drop whatever it started for that line alone. One listener on the box, so the
// lines a poll appends or redraws need no wiring of their own.
function wireDelete(step) {
  const box = $('#stepChat[data-live]');
  if (!box) return;
  box.addEventListener('click', async e => {
    const btn = e.target.closest('[data-delete]');
    if (!btn) return;
    const ok = await askConfirm({ title: 'Delete this message?',
      text: 'It leaves the conversation and the agent is told to drop it: whatever it started '
        + 'for this message alone stops. Work it already finished stays until you ask for it '
        + 'to be undone.',
      confirmLabel: 'Delete message' });
    if (!ok) return;
    btn.disabled = true;
    const res = await sendAnswer({ kind: 'delete', step: step.id, id: Number(btn.dataset.delete) });
    if (!res.ok) btn.disabled = false;
    tick();
  });
}

// Appended rather than re-rendered: rebuilding the panel would reload the mockup
// preview iframe and throw away whatever is half-typed in the composer. Only a deleted
// line - the lines on screen no longer lead the transcript - redraws, and the box alone.
function updateChat(step) {
  const box = $('#stepChat');
  if (!box) return;
  const msgs = step.chat || [];
  const live = !!box.dataset.live;
  const shown = [...box.children].map(el => el.dataset.id);
  if (shown.length > msgs.length || shown.some((id, i) => id !== String(msgs[i].id))) {
    box.innerHTML = chatHtml(msgs, live);
    return;
  }
  if (shown.length < msgs.length) {
    box.insertAdjacentHTML('beforeend', chatHtml(msgs.slice(shown.length), live));
  }
}

function renderProgress(task, step) {
  const live = liveOf(task, step);
  // The mockups step offers its screenshots from the first round on, and after approval.
  const shots = step.id === 3 && step.status !== 'waiting';
  // A round the user answered with feedback is being reworked; it can still be approved as it was.
  const rework = step.id === 3 && live && task.mockupReview && task.mockupReview.answered;
  $('#panel').innerHTML = `
    ${panelHead(esc(step.name), step)}
    ${progressBar()}
    ${shots ? `<div class="gate-actions">${screenshotsButton()}${rework
    ? '<button id="approveRework" class="secondary" title="Stops the rework and keeps the round you saw">Approve the last round</button>' : ''}</div>
    <p class="hint" id="shotsHint" hidden></p>` : ''}
    <ul class="log" id="log"></ul>
    ${chatBlock(step, live)}`;
  wireChat(step);
  wireStop(step);
  wireScreenshots();
  if ($('#approveRework')) {
    $('#approveRework').addEventListener('click', async () => {
      const ok = await askConfirm({ title: 'Approve the last round?',
        text: 'The agent stops reworking, puts back the screens you saw and records them as the approved design. What you asked for in your feedback is dropped.',
        confirmLabel: 'Approve the last round' });
      if (!ok) return;
      lockPanel('Approved — recording the approved round…');
      await sendAnswer({ kind: 'mockup', decision: 'approve' });
      lastSig = null;
      tick();
    });
  }
  updateDynamic(task, step);
}

// Runs on every tick of a view-only step, which is most of a long run — so each
// piece is written only when its own value actually moved.
function updateDynamic(task, step) {
  updateStopped(step);
  updateChat(step);
  // Under a question or a review the step waits on the user, whatever the agent last said
  // it was doing - and a bar that runs on would say otherwise.
  const waiting = { question: 'Waiting for your answer', review: 'Waiting for your review' }[
    gateOf(task, step)];
  const fill = $('#barFill');
  if (fill) {
    const indeterminate = !waiting && step.progress == null && step.status === 'in_progress'
      && !step.stopped;
    const width = indeterminate ? '100%' : `${step.progress || 0}%`;
    fill.classList.toggle('indeterminate', indeterminate);
    if (fill.style.width !== width) fill.style.width = width;
  }
  const op = $('#op');
  const opText = (step.progress != null ? `${step.progress}% — ` : '')
    + (waiting || step.currentOperation || '');
  if (op && op.textContent !== opText) op.textContent = opText;
  const log = $('#log');
  if (!log) return;
  const entries = step.log.slice(-15);
  const sigNow = `${step.log.length}|${entries.length && entries[entries.length - 1].time}`;
  if (log.dataset.sig === sigNow) return;
  log.dataset.sig = sigNow;
  log.innerHTML = entries.reverse().map(e =>
    `<li><time>${esc(e.time.slice(11, 19))}</time>${esc(e.text)}</li>`).join('');
}

function renderFailed(step, live) {
  // Step 7 runs after the pipeline is already finished, so declining its retry drops
  // the user back on the summary instead of ending the run.
  const isMockoon = step.id === MOCKOON_STEP;
  // Nobody is waiting on this one any more, so Retry and Finish would send a
  // decision into an empty queue for a later gate to mistake for its own.
  if (!live) {
    $('#panel').innerHTML = `
      <h2>${esc(step.name)} — failed</h2>
      <pre class="report">${esc(step.report || 'No report provided.')}</pre>
      <p class="muted">The pipeline is no longer waiting on this step.</p>
      ${chatBlock(step, false)}`;
    return;
  }
  // The agent that failed is gone, so what is typed here is not for it: the
  // orchestrator holds it and hands it to the fresh agent a retry spawns.
  $('#panel').innerHTML = `
    <h2>${esc(step.name)} — failed</h2>
    <pre class="report">${esc(step.report || 'No report provided.')}</pre>
    <button id="retry" class="danger">Retry step</button>
    <button id="${isMockoon ? 'backToSummary' : 'finish'}" class="secondary">${
      isMockoon ? 'Back to summary' : 'Finish'}</button>
    ${chatBlock(step, true)}`;
  wireChat(step);
  // The server puts the step back to work as it records the retry, so the poll run right
  // away draws it running - the failure is not left on screen until the new agent reports.
  $('#retry').addEventListener('click', () =>
    sendFrom('#panel', async () => !!(await sendAnswer({ kind: 'decision', decision: 'retry' })).ok));
  if (isMockoon) {
    // The decision still goes out — it is what releases the orchestrator's failure gate.
    $('#backToSummary').addEventListener('click', async () => {
      if ((await sendAnswer({ kind: 'decision', decision: 'finish' })).ok) backToSummary();
    });
    return;
  }
  // Nothing on a failure the user gives up on is left to read, so it leaves the screen with
  // the click, and the lock's notice is all there is until the summary is written.
  $('#finish').addEventListener('click', async () => {
    lockPanel('Finishing the pipeline…', true, true);
    if ((await sendAnswer({ kind: 'decision', decision: 'finish' })).ok) return;
    // Not sent: the failure comes back as it was, buttons and all.
    viewOf(activeTask).locked = null;
    lastSig = null;
    tick();
  });
}

function backToSummary() {
  const v = viewOf(activeTask);
  v.showSummary = true;
  v.viewStep = null;
  lastSig = null;
  tick();
}

// navigator.clipboard works on 127.0.0.1 (a secure context), but a denied permission
// or an older browser must still copy — hence the hidden-textarea fallback.
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return;
  } catch (_e) { /* fall through to the legacy path */ }
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  ta.remove();
}

function renderMockoon(task, step) {
  if (step.status !== 'completed') return renderProgress(task, step);
  $('#panel').innerHTML = `
    <h2>${esc(step.name)}</h2>
    <p class="muted">Import it in Mockoon (Import/export → Mockoon's format → from clipboard).
      The environment listens on <code>http://localhost:3000</code>.</p>
    <pre class="report" id="mockoonJson">Loading…</pre>
    <button id="copyMockoon" disabled>Copy JSON</button>
    <button id="backToSummary" class="secondary">Back to summary</button>`;
  $('#backToSummary').addEventListener('click', backToSummary);
  const copy = $('#copyMockoon');
  // The environment is fetched straight from the session dir, so nothing renders
  // it into the orchestrator's context on the way here.
  fetch(`/api/mockoon?taskId=${encodeURIComponent(activeTask)}`)
    .then(r => (r.ok ? r.text() : Promise.reject(new Error(String(r.status)))))
    .then(text => {
      $('#mockoonJson').textContent = text;
      copy.disabled = false;
      copy.addEventListener('click', async () => {
        await copyText(text);
        copy.textContent = 'Copied';
        setTimeout(() => { copy.textContent = 'Copy JSON'; }, 2000);
      });
    })
    .catch(() => {
      $('#mockoonJson').textContent = 'mockoon.json is missing — regenerate the mocks.';
    });
}

// The story is read straight from the task dir, like the Mockoon environment, and
// shown as plain text: it is meant to be pasted into a tracker exactly as written.
function loadStory() {
  const copy = $('#copyStory');
  fetch(`/api/story?taskId=${encodeURIComponent(activeTask)}`)
    .then(r => (r.ok ? r.text() : Promise.reject(new Error(String(r.status)))))
    .then(text => {
      $('#storyText').textContent = text;
      copy.disabled = false;
      copy.addEventListener('click', async () => {
        await copyText(text);
        copy.textContent = 'Copied';
        setTimeout(() => { copy.textContent = 'Copy story'; }, 2000);
      });
    })
    .catch(() => {
      $('#storyText').textContent = 'story.md is missing — resubmit the requirements to write it again.';
    });
}

function renderStory(task, step) {
  $('#panel').innerHTML = `
    <h2>${esc(step.name)}</h2>
    <pre class="report" id="storyText">Loading…</pre>
    <button id="copyStory" disabled>Copy story</button>
    ${chatBlock(step, liveOf(task, step))}`;
  wireChat(step);
  loadStory();
}

// The tasks "Shut down and create pull request" opens one for: every one whose pipeline finished
// without failing - the server picks the same ones (prReady).
const prReadyTasks = () => ((lastState && lastState.tasks) || [])
  .filter(t => t.summary && !/^failed/i.test(String(t.summary.finalStatus || '').trim()));

function renderSummary(task) {
  const sum = task.summary;
  const prTasks = prReadyTasks();
  const mockoon = task.steps.find(s => s.id === MOCKOON_STEP) || {};
  const hasMocks = mockoon.status === 'completed';
  const story = task.steps.find(s => s.id === STORY_STEP) || {};
  const hasStory = story.enabled !== false && story.status === 'completed';
  const list = items => `<ul>${(items || []).map(i => `<li>${esc(i)}</li>`).join('')}</ul>`;
  const block = text => `<pre class="summary-text">${esc(text || '—')}</pre>`;
  $('#panel').innerHTML = `<div class="summary">
    <h2>Pipeline summary</h2>
    <section><h3>Final status</h3>
      <p class="status-final">${esc(sum.finalStatus || '')}</p></section>
    <section><h3>Changes</h3>${list(sum.changes)}</section>
    <section><h3>Implemented features</h3>${list(sum.features)}</section>
    <section><h3>Test results</h3>${block(sum.tests)}</section>
    <section><h3>API mocks</h3>${block(sum.apiMocks)}</section>
    <section><h3>Mockup comparison</h3>${block(sum.mockupComparison)}</section>
    <section><h3>UX review</h3>${block(sum.uxReview)}</section>
    <section><h3>Code review</h3>${block(sum.codeReview)}</section>
    ${hasStory ? `<section id="story-section"><h3>Story</h3>
      <pre class="summary-text" id="storyText">Loading…</pre>
      <button id="copyStory" disabled>Copy story</button></section>` : ''}
    <section id="mockoon-section"><h3>Mockoon mocks</h3>
      <p class="muted">A ready-to-import Mockoon environment for the feature's API,
        listening on <code>http://localhost:3000</code>.</p>
      ${hasMocks ? '<button id="showMockoon">Show Mockoon JSON</button>' : ''}
      <button id="generateMockoon"${hasMocks ? ' class="secondary"' : ''}>${
        hasMocks ? 'Regenerate' : 'Generate Mockoon mocks'}</button>
    </section>
    <section id="shutdown-section">
      <button id="shutdownPr"${prTasks.length ? '' : ` disabled title="No task finished its pipeline: there is nothing to open a pull request for"`}>Shut down and create pull request</button>
      <button id="shutdown" class="secondary">Shut down server</button>
    </section>
  </div>`;
  if (hasStory) loadStory();
  // Already generated: the JSON is one local switch away, no agent needed.
  if (hasMocks) {
    $('#showMockoon').addEventListener('click', () => {
      viewOf(activeTask).showSummary = false;
      tick();
    });
  }
  $('#generateMockoon').addEventListener('click', () => {
    lockPanel('Requested — the agent is building the Mockoon environment…');
    sendAnswer({ kind: 'summary', decision: 'mockoon' });
  });
  $('#shutdownPr').addEventListener('click', async () => {
    const list = prTasks.map(t => `${t.branch || t.id} → ${t.base || 'its base branch'}`).join(', ');
    const ok = await askConfirm({
      title: 'Shut down and create pull request?',
      text: `For ${list}: commit the staged changes with the step-1 commit message, push the branch, open a pull request into the branch it was started from, and remove the task's worktree. The server stops right away; each task's orchestrator terminal does the rest and prints the pull request link.`,
      confirmLabel: 'Shut down and create pull request' });
    if (!ok) return;
    serverDown = true;
    $('#shutdownPr').disabled = true;
    $('#shutdown').disabled = true;
    const sent = await sendAnswer({ kind: 'summary', decision: 'shutdown_pr' });
    if (!sent.ok) {
      serverDown = false;
      $('#shutdownPr').disabled = false;
      $('#shutdown').disabled = false;
      return;
    }
    // A moment for every listening orchestrator to take its answer before the socket dies.
    await new Promise(resolve => setTimeout(resolve, 1500));
    try { await postJson('/api/shutdown', {}); } catch (_e) { /* server exits mid-response */ }
    $('#shutdown-section').innerHTML = `<p class="muted">Server stopped — the orchestrator terminal of ${
      esc(sent.tasks.join(', '))} commits, pushes and opens the pull request; the link appears there.</p>`;
  });
  $('#shutdown').addEventListener('click', async () => {
    serverDown = true;
    $('#shutdown').disabled = true;
    if ($('#shutdownPr')) $('#shutdownPr').disabled = true;
    // Ends the orchestrator's post-summary poll before the socket dies under it.
    try { await sendAnswer({ kind: 'summary', decision: 'shutdown' }); } catch (_e) { /* gone */ }
    try { await postJson('/api/shutdown', {}); } catch (_e) { /* server exits mid-response */ }
    $('#shutdown-section').innerHTML =
      '<p class="muted">Server stopped — you can close this tab.</p>';
  });
}

// Both ways to start another task. They sit in the rail rather than in the step-1
// panel, so they work from whatever step the open task is on — and that is also why
// the copy reads step 1 from the task itself instead of from the DOM: the panel on
// screen is usually showing something else entirely.
async function newTask(copy, btn) {
  const task = currentTask();
  if (!task) return;
  btn.disabled = true;
  // A no-op unless the step-1 form is the panel on screen; when it is, this is what
  // puts the half-typed version of it into the draft step1Of then reads.
  snapshotStep1();
  const v = viewOf(task.id);
  const from = step1Of(task);
  // Credentials are deliberately not among the values: they never travel through the
  // state document. The server copies the source task's auth.json instead, and what
  // was typed but not submitted rides across in the draft below.
  const { id } = await postJson('/api/tasks', copy ? { copyFrom: task.id, values: {
    taskDescription: from.taskDescription,
    contractsText: from.contractsText, hintsNote: from.hintsNote,
    refinement: from.refinement, generateMockups: from.generateMockups,
    storyDescription: from.storyDescription, codeReview: from.codeReview,
    commitMessage: from.commitMessage, finalReview: from.finalReview, finalCodeReview: from.finalCodeReview,
    agents: agentsOf(from) } } : {});
  if (id) {
    // The server copies what it holds — the form and the uploaded files. What only the
    // page holds, typed credentials and files picked but not uploaded yet, is carried
    // here. The branch is not: two tasks cannot share one, so the copy starts without it.
    if (copy) {
      viewOf(id).draft = { ...from, branch: '' };
      viewOf(id).picked = { ...v.picked };
    }
    // A brand-new task sits at waiting; put it straight into its form.
    await postJson('/api/state', { taskId: id, step: 1, status: 'in_progress', activeStep: 1 });
    activeTask = id;
  }
  btn.disabled = false;
  lastSig = null;
  tick();
}
// Non-destructive and reversible with the tab's ×, so neither asks to confirm — and
// both stay live on a frozen task, which is the way to change direction.
$('#createTask').addEventListener('click', e => newTask(true, e.currentTarget));
$('#createEmptyTask').addEventListener('click', e => newTask(false, e.currentTarget));

// The rail is chrome, not pipeline state. Its width is remembered for this page only:
// the server picks a fresh port every run, so the store dies with the session anyway.
const SIDEBAR_KEY = 'inf.sidebar.collapsed';
function setSidebar(collapsed) {
  const btn = $('#sidebarToggle');
  document.documentElement.dataset.rail = collapsed ? 'collapsed' : 'open';
  btn.innerHTML = collapsed ? CHEVRON_RIGHT : CHEVRON_LEFT;
  btn.setAttribute('aria-expanded', String(!collapsed));
  const label = collapsed ? 'Show sidebar' : 'Hide sidebar';
  btn.setAttribute('aria-label', label);
  btn.setAttribute('title', label);
  try { localStorage.setItem(SIDEBAR_KEY, collapsed ? '1' : '0'); } catch (_e) { /* blocked */ }
}
$('#sidebarToggle').addEventListener('click', () =>
  setSidebar(document.documentElement.dataset.rail !== 'collapsed'));
let sidebarCollapsed = false;
try { sidebarCollapsed = localStorage.getItem(SIDEBAR_KEY) === '1'; } catch (_e) { /* blocked */ }
setSidebar(sidebarCollapsed);

// The flag list changes only with the plugin, so one request per page is enough.
fetch('/api/review-flags')
  .then(r => (r.ok ? r.json() : Promise.reject(new Error(String(r.status)))))
  .then(j => {
    reviewFlags = Array.isArray(j.flags) ? j.flags : [];
    reviewRunsMax = j.maxRuns || reviewRunsMax;
    reviewRunsDefault = j.defaultRuns || reviewRunsDefault;
    finalRunsDefault = j.defaultFinalRuns || finalRunsDefault;
    if (refreshRuns) refreshRuns();
  })
  .catch(() => { /* the runs keep showing the flags they hold, by name */ });

setInterval(tick, 1000);
tick();
</script>
