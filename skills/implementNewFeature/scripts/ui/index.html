<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>implementNewFeature</title>
<style>
  :root {
    --bg:#07090f; --card:#1c2438; --card-2:#121927; --border:#324061; --border-hi:#44567f;
    --text:#eef1f8; --muted:#9aa3ba; --accent:#7c8cf8; --accent-2:#a78bfa;
    --waiting:#64748b; --in_progress:#7c8cf8; --completed:#34d399; --failed:#f87171;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; font-family:'Inter','Segoe UI',system-ui,sans-serif; line-height:1.5;
    background:radial-gradient(1100px 550px at 70% -10%, #121728 0%, var(--bg) 55%) fixed;
    color:var(--text);
  }
  .wrap { max-width:980px; margin:0 auto; padding:32px 20px 72px; }
  h1 { font-size:22px; margin:0 0 28px; letter-spacing:.2px; width:fit-content;
       background:linear-gradient(90deg,var(--accent),var(--accent-2));
       -webkit-background-clip:text; background-clip:text; color:transparent; }
  .stepper { display:flex; gap:10px; margin-bottom:28px; flex-wrap:wrap; }
  /* 120px basis keeps all seven tiles (Mockups enabled) on a single row at 940px. */
  .step { flex:1 1 120px; background:var(--card); border:1px solid var(--border); border-radius:14px;
          padding:14px 10px; text-align:center; transition:border-color .25s, box-shadow .25s;
          box-shadow:0 12px 28px -18px rgba(0,0,0,.9); }
  .step.in_progress { border-color:var(--accent);
          box-shadow:0 0 0 1px rgba(124,140,248,.35), 0 8px 24px -12px rgba(124,140,248,.45); }
  .step .num { display:inline-flex; align-items:center; justify-content:center;
          width:28px; height:28px; border-radius:50%; color:#0b0e14; font-size:13px; font-weight:700;
          background:var(--waiting); margin-bottom:8px; }
  .step.in_progress .num { background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff;
          animation:pulse 1.6s ease-in-out infinite; }
  .step.completed .num { background:var(--completed); }
  .step.failed .num { background:var(--failed); color:#fff; }
  @keyframes pulse { 50% { opacity:.55; } }
  .step .name { display:block; font-size:12.5px; font-weight:600; }
  .step .badge { display:block; font-size:10.5px; margin-top:5px; text-transform:uppercase;
          letter-spacing:.8px; font-weight:600; color:var(--waiting); }
  .step.in_progress .badge { color:var(--accent); }
  .step.completed .badge { color:var(--completed); }
  .step.failed .badge { color:var(--failed); }
  .panel { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:24px;
          box-shadow:0 20px 50px -30px rgba(0,0,0,.8); }
  .panel h2 { margin:0 0 14px; font-size:17px; }
  label { display:block; font-size:13px; font-weight:600; margin:16px 0 6px; color:var(--muted); }
  label .req { color:var(--failed); }
  textarea, input[type=file], input[type=text], input[type=password] {
          width:100%; font:inherit; color:var(--text); }
  textarea, input[type=text], input[type=password] { background:var(--card-2);
          border:1px solid var(--border); border-radius:10px; padding:10px 12px; }
  /* Height is driven by autoGrow(); manual dragging would fight it. */
  textarea { min-height:90px; resize:none; overflow-y:hidden; }
  textarea:focus, input[type=text]:focus, input[type=password]:focus { outline:none;
          border-color:var(--accent); box-shadow:0 0 0 3px rgba(124,140,248,.18); }
  .panel h3 { font-size:14px; margin:22px 0 0; color:var(--accent); }
  input[type=file] { background:var(--card-2); border:1px dashed var(--border); border-radius:10px;
          padding:10px; color:var(--muted); }
  button { font:inherit; font-weight:600; border:0; border-radius:10px; padding:10px 20px; cursor:pointer;
          background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff; margin-top:16px;
          transition:filter .15s, transform .15s; }
  button:hover:not(:disabled) { filter:brightness(1.12); transform:translateY(-1px); }
  button:disabled { background:var(--border); color:var(--muted); cursor:not-allowed; transform:none; }
  button.secondary { background:var(--card-2); border:1px solid var(--border); color:var(--text); }
  button.danger { background:var(--failed); }
  .options button { display:block; width:100%; text-align:left; background:var(--card-2);
          color:var(--text); border:1px solid var(--border); margin-top:10px; font-weight:500; }
  .options button:hover:not(:disabled) { border-color:var(--accent); background:#1a2338;
          transform:none; filter:none; }
  .options button.selected { border-color:var(--accent); background:rgba(124,140,248,.14);
          color:var(--text); }
  .field-with-btn { position:relative; }
  .field-with-btn input { padding-right:46px; }
  button.reveal { position:absolute; top:50%; right:6px; transform:translateY(-50%); margin:0;
          background:transparent; padding:6px 8px; color:var(--muted); line-height:0;
          border-radius:8px; }
  button.reveal:hover:not(:disabled) { color:var(--text); background:var(--card);
          transform:translateY(-50%); filter:none; }
  button.reveal[aria-pressed=true] { color:var(--accent); }
  button.reveal:disabled { background:transparent; }
  .switch { display:flex; align-items:center; gap:10px; margin-top:12px; }
  .switch input { appearance:none; -webkit-appearance:none; flex:none; margin:0; cursor:pointer;
          width:40px; height:22px; border-radius:99px; background:var(--card-2);
          border:1px solid var(--border); position:relative;
          transition:background .2s, border-color .2s; }
  .switch input::after { content:''; position:absolute; top:2px; left:2px; width:16px; height:16px;
          border-radius:50%; background:var(--muted); transition:transform .2s, background .2s; }
  .switch input:checked { background:rgba(124,140,248,.28); border-color:var(--accent); }
  .switch input:checked::after { transform:translateX(18px); background:var(--accent); }
  .switch input:disabled { opacity:.5; cursor:not-allowed; }
  .switch label { margin:0; color:var(--text); cursor:pointer; }
  .hint { font-size:12.5px; color:var(--muted); margin:6px 0 0; }
  .mockup-bar { display:flex; justify-content:space-between; align-items:center; gap:12px;
          flex-wrap:wrap; margin:18px 0 10px; }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; }
  .tabs button { margin-top:0; padding:6px 12px; font-size:12.5px; background:var(--card-2);
          color:var(--muted); border:1px solid var(--border); }
  .tabs button:hover:not(:disabled) { color:var(--text); border-color:var(--border-hi);
          transform:none; filter:none; }
  .tabs button.selected { color:var(--text); border-color:var(--accent);
          background:rgba(124,140,248,.14); }
  .frame { overflow:hidden; border:1px solid var(--border); border-radius:12px;
          background:var(--card-2); }
  .frame iframe { border:0; display:block; transform-origin:top left; }
  .chat { margin-top:18px; border-top:1px solid var(--border); }
  .msg { padding:10px 0; border-bottom:1px solid var(--border); font-size:13px;
          white-space:pre-wrap; color:#c3c9d6; }
  .msg .who { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.8px;
          font-weight:700; margin-bottom:4px; color:var(--muted); }
  .msg.user .who { color:var(--accent); }
  .bar { height:8px; background:var(--card-2); border:1px solid var(--border); border-radius:99px;
          overflow:hidden; margin:10px 0 6px; }
  .bar > div { height:100%; background:linear-gradient(90deg,var(--accent),var(--accent-2));
          width:0; border-radius:99px; transition:width .4s; }
  .bar > div.indeterminate { width:100%; transition:none;
          background:linear-gradient(90deg,transparent,rgba(124,140,248,.75),transparent);
          background-size:40% 100%; background-repeat:no-repeat;
          animation:slide 1.4s ease-in-out infinite; }
  @keyframes slide { 0% { background-position:-40% 0; } 100% { background-position:140% 0; } }
  .op { font-size:13px; color:var(--muted); margin:6px 0 14px; }
  .log { list-style:none; margin:10px 0 0; padding:0; font-size:12.5px; }
  .log li { padding:6px 0; border-top:1px solid var(--border); color:#c3c9d6; }
  .log time { color:var(--waiting); margin-right:10px; font-variant-numeric:tabular-nums;
          font-family:ui-monospace,Consolas,monospace; font-size:11.5px; }
  pre.report, pre.summary-text { white-space:pre-wrap; background:var(--card-2);
          border:1px solid var(--border); border-radius:10px; padding:14px; font-size:13px;
          color:#c3c9d6; }
  /* A Mockoon environment is hundreds of lines — cap it so the copy button stays on screen. */
  pre#mockoonJson { max-height:45vh; overflow:auto; overflow-wrap:anywhere; }
  code { font-family:ui-monospace,Consolas,monospace; font-size:12.5px; padding:1px 6px;
          background:var(--card-2); border:1px solid var(--border); border-radius:6px; }
  .muted { color:var(--muted); font-size:13px; }
  a { color:var(--accent); }
  .notice { display:flex; align-items:center; gap:10px; margin-top:16px; padding:12px 14px;
          border:1px solid var(--border-hi); border-radius:10px; background:rgba(124,140,248,.08);
          font-size:13px; }
  .spinner { width:14px; height:14px; border-radius:50%; border:2px solid var(--accent);
          border-top-color:transparent; animation:spin .8s linear infinite; flex:none; }
  @keyframes spin { to { transform:rotate(360deg); } }
  dialog.confirm { border:1px solid var(--border-hi); border-radius:16px; padding:22px 24px;
          background:var(--card); color:var(--text); max-width:min(460px, calc(100vw - 40px));
          box-shadow:0 30px 60px -30px rgba(0,0,0,.9); }
  dialog.confirm::backdrop { background:rgba(5,7,12,.66); }
  dialog.confirm h3 { margin:0 0 8px; font-size:16px; }
  dialog.confirm p { margin:0; font-size:13.5px; color:var(--muted); white-space:pre-wrap;
          overflow-wrap:anywhere; }
  .confirm-actions { display:flex; gap:10px; justify-content:flex-end; }
  .summary section { margin-bottom:18px; }
  .summary h3 { font-size:14px; margin:0 0 6px; color:var(--accent); }
  .summary ul { margin:0; padding-left:20px; }
  .status-final { font-size:15px; font-weight:700; }
</style>
</head>
<body>
<div class="wrap">
  <h1>implementNewFeature</h1>
  <div class="stepper" id="stepper"></div>
  <div class="panel" id="panel"><p class="muted">Connecting…</p></div>
</div>
<dialog id="confirmDialog" class="confirm" aria-labelledby="confirmTitle">
  <h3 id="confirmTitle"></h3>
  <p id="confirmText"></p>
  <div class="confirm-actions">
    <button id="confirmCancel" class="secondary">Cancel</button>
    <button id="confirmOk">Confirm</button>
  </div>
</dialog>
<script>
'use strict';
const STEP_NAMES = ['Requirements', 'Feature Refinement', 'Mockups', 'Implementation',
  'Validation & E2E', 'Code Review', 'Mockoon Mocks'];
const MOCKOON_STEP = 7;
const BADGE = { waiting: 'Waiting', in_progress: 'In Progress',
  completed: 'Completed', failed: 'Failed' };
const MOCKUP_VIEWPORTS = { Desktop: [1280, 800], Mobile: [390, 780] };
const EYE = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"'
  + ' stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
  + '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"'
  + ' stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
  + '<path d="M17.9 17.9A10 10 0 0 1 12 20C5 20 1 12 1 12a18.5 18.5 0 0 1 5.1-5.9M9.9 4.2A9.1 9.1 0'
  + ' 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.2 3.2m-6.7-1.1a3 3 0 1 1-4.2-4.2"/>'
  + '<path d="M1 1l22 22"/></svg>';
let lastSig = null;
let serverDown = false; // set when the user shuts the server down from the summary
// Which tab is open is page state, never server state: parallel pipelines write
// to the state concurrently and must not yank the user's view to another task.
let activeTask = null;
// Per-task view state, so switching tabs never leaks one task's preview selection
// or summary toggle into another's. Step 7 runs on demand once the summary exists,
// so which of the two screens is visible is the user's choice, not a pipeline state.
const view = {};
const viewOf = id => (view[id] || (view[id] = {
  showSummary: false, mockupScreen: 0, mockupViewport: 'Desktop'
}));

const $ = sel => document.querySelector(sel);
const esc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;');

function toB64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(',')[1]);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
async function postJson(url, body) {
  const res = await fetch(url, { method: 'POST',
    headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  // Create-task needs the new id back; every other caller ignores the result,
  // and /api/shutdown dies mid-response, hence the catch.
  return res.json().catch(() => ({}));
}
const sendAnswer = payload => postJson('/api/answer', { taskId: activeTask, ...payload });

// In-page confirmation modal — never window.confirm(): a native dialog freezes the page
// (and any browser automation driving it), cannot be styled and cannot be asserted on.
// Every answer submitted in steps 1-3 goes through it, so one stray click never advances
// the pipeline. Resolves false on Cancel and on Esc.
function askConfirm({ title, text, confirmLabel }) {
  const dlg = $('#confirmDialog');
  $('#confirmTitle').textContent = title;
  $('#confirmText').textContent = text;
  $('#confirmOk').textContent = confirmLabel || 'Confirm';
  dlg.returnValue = '';
  return new Promise(resolve => {
    const onClose = () => {
      dlg.removeEventListener('close', onClose);
      resolve(dlg.returnValue === 'ok');
    };
    dlg.addEventListener('close', onClose);
    dlg.showModal();
    $('#confirmCancel').focus();  // Enter must not confirm by accident
  });
}
$('#confirmOk').addEventListener('click', () => $('#confirmDialog').close('ok'));
$('#confirmCancel').addEventListener('click', () => $('#confirmDialog').close('cancel'));

// Instant click feedback: disable every control and show a spinner notice.
// The panel stays locked until the orchestrator changes the state (sig changes).
function lockPanel(message) {
  document.querySelectorAll('#panel button, #panel textarea, #panel input')
    .forEach(el => { el.disabled = true; });
  const n = document.createElement('div');
  n.className = 'notice';
  const spin = document.createElement('span');
  spin.className = 'spinner';
  const txt = document.createElement('span');
  txt.textContent = message;
  n.append(spin, txt);
  $('#panel').appendChild(n);
}

// Textareas grow with their content up to 45vh, then scroll — a pasted wall of
// text must never push the panel's buttons off screen.
function autoGrow(el) {
  el.style.height = 'auto';
  const border = el.offsetHeight - el.clientHeight;
  const max = Math.round(window.innerHeight * 0.45);
  const want = el.scrollHeight + border;
  el.style.height = `${Math.min(want, max)}px`;
  el.style.overflowY = want > max ? 'auto' : 'hidden';
}

function wireTextareas() {
  document.querySelectorAll('#panel textarea').forEach(el => {
    if (!el.dataset.autogrow) {
      el.dataset.autogrow = '1';
      el.addEventListener('input', () => autoGrow(el));
    }
    autoGrow(el);
  });
}

window.addEventListener('resize', wireTextareas);

async function tick() {
  if (serverDown) return;
  let state;
  try {
    state = await (await fetch('/api/state')).json();
  } catch (_e) {
    $('#panel').innerHTML = '<p class="muted">Server unreachable — retrying…</p>';
    lastSig = null;
    return;
  }
  if (!activeTask || !state.tasks.some(t => t.id === activeTask)) {
    activeTask = state.tasks[0].id;
    lastSig = null;
  }
  const task = state.tasks.find(t => t.id === activeTask);
  renderStepper(task);
  renderPanel(state, task);
}

// Step ids are fixed, but disabled steps (Mockups when the toggle stayed off)
// are hidden and the visible ones are numbered 1..n so the badges stay contiguous.
function renderStepper(task) {
  $('#stepper').innerHTML = task.steps.filter(s => s.enabled !== false).map((s, i) => `
    <div class="step ${s.status}">
      <span class="num">${i + 1}</span>
      <span class="name">${esc(s.name || STEP_NAMES[s.id - 1])}</span>
      <span class="badge">${BADGE[s.status] || s.status}</span>
    </div>`).join('');
}

const activeStepOf = task =>
  task.steps.find(s => s.id === task.activeStep) || task.steps[0];

// A task stopped at a gate, waiting for the user rather than for an agent.
const pending = task => !!(task.question || task.reviewSummary || task.mockupReview);

function sig(task) {
  const v = viewOf(task.id);
  const step = activeStepOf(task);
  const mockoon = task.steps.find(s => s.id === MOCKOON_STEP);
  return [task.id, task.activeStep, step.status,
    task.question ? `q${task.questionSeq || 0}` : '',
    task.reviewSummary ? '1' : '',
    // rev changes on every agent round, which re-renders the mockup panel and
    // clears the lock left by the previous Send.
    task.mockupReview ? `m${task.mockupReview.rev || 0}` : '',
    task.summary ? '1' : '',
    // The Mockoon step changes status while the summary is the visible screen,
    // and the switch between the two screens is local — both must re-render.
    mockoon ? mockoon.status : '', v.showSummary ? 'S' : ''].join('|');
}

function renderPanel(state, task) {
  const v = viewOf(task.id);
  const mockoon = task.steps.find(s => s.id === MOCKOON_STEP);
  // A fresh Mockoon run always pulls the user back onto its panel, whatever they
  // were looking at when they asked for it.
  if (mockoon && mockoon.status === 'in_progress') v.showSummary = false;
  const s = sig(task);
  const step = activeStepOf(task);
  if (s === lastSig) { updateDynamic(step); return; }
  lastSig = s;
  renderActive(task, step);
  wireTextareas();
}

function renderActive(task, step) {
  // Mockoon mocks are generated after the pipeline is over, so while step 7 is the
  // active one its panel outranks the summary — until the user asks to go back.
  if (task.activeStep === MOCKOON_STEP && !viewOf(task.id).showSummary) {
    return step.status === 'failed' ? renderFailed(step) : renderMockoon(step);
  }
  if (task.summary) return renderSummary(task);
  if (step.status === 'failed') return renderFailed(step);
  // Any step may ask: the refinement Q&A in step 2, the required Chrome extension in step 5.
  if (task.question) return renderQuestion(task.question, step);
  if (task.activeStep === 1) return renderStep1(task);
  if (task.activeStep === 2 && task.reviewSummary) return renderReview(task.reviewSummary);
  if (task.activeStep === 3 && task.mockupReview) {
    return renderMockupReview(task.mockupReview);
  }
  renderProgress(step);
}

function renderStep1(task) {
  const step = task.steps[0];
  if (step.status !== 'in_progress') {
    $('#panel').innerHTML = '<p class="muted">Waiting for the pipeline…</p>';
    return;
  }
  $('#panel').innerHTML = `
    <h2>Requirements</h2>
    <label>Task description <span class="req">*</span></label>
    <textarea id="task"></textarea>
    <label>Business requirements <span class="req">*</span></label>
    <textarea id="biz"></textarea>
    <h3>Additional materials (optional)</h3>
    <p class="muted">Inspirations, screenshots of another app, diagrams, exported designs —
      anything that should guide the refinement questions and the mockup design.</p>
    <label>Files</label>
    <input type="file" id="hints" multiple>
    <div id="hintsNoteBox" hidden>
      <label>What should we take from these files?</label>
      <textarea id="hintsNote"
        placeholder="e.g. copy the card layout from screen 2, ignore the colors"></textarea>
    </div>
    <label>Mockups (optional)</label>
    <input type="file" id="mockups" multiple accept="image/*,.pdf">
    <div class="switch">
      <input type="checkbox" id="genMockups">
      <label for="genMockups">Generate mockups</label>
    </div>
    <p class="hint">Adds a Mockups step after planning: an agent designs the screens from the plan
      (and from the files above, if any), you refine them in a chat, and the approved design drives
      both the implementation and the visual E2E comparison.</p>
    <label>API contracts / specs (optional — files or pasted text)</label>
    <input type="file" id="contracts" multiple>
    <textarea id="contractsText" placeholder="…or paste contracts here"></textarea>
    <h3>Authorization (optional)</h3>
    <p class="muted">Credentials for E2E tests only — stored in the session dir, outside git.</p>
    <label>Login</label>
    <input type="text" id="authLogin" autocomplete="off">
    <label>Password</label>
    <div class="field-with-btn">
      <input type="password" id="authPassword" autocomplete="new-password">
      <button type="button" id="togglePassword" class="reveal" aria-pressed="false"
        aria-label="Show password" title="Show password">${EYE}</button>
    </div>
    <button id="next" disabled>Next</button>`;
  $('#togglePassword').addEventListener('click', () => {
    const input = $('#authPassword');
    const btn = $('#togglePassword');
    const reveal = input.type === 'password';
    input.type = reveal ? 'text' : 'password';
    btn.innerHTML = reveal ? EYE_OFF : EYE;
    btn.setAttribute('aria-pressed', String(reveal));
    btn.setAttribute('aria-label', reveal ? 'Hide password' : 'Show password');
    btn.setAttribute('title', reveal ? 'Hide password' : 'Show password');
    input.focus();
  });
  // The note only makes sense once there is something to describe, so it stays
  // hidden until the first file is picked (and disappears again if all are removed).
  $('#hints').addEventListener('change', () => {
    $('#hintsNoteBox').hidden = $('#hints').files.length === 0;
    wireTextareas();
  });
  const auth = () => {
    const login = $('#authLogin').value.trim();
    const password = $('#authPassword').value;
    return { login, password, complete: !!(login && password.trim()) };
  };
  const gate = () => {
    const a = auth();
    // Auth is all-or-nothing: filling exactly one of the two fields blocks Next.
    $('#next').disabled = !($('#task').value.trim() && $('#biz').value.trim()
      && (a.complete || (!a.login && !a.password.trim())));
  };
  ['#task', '#biz', '#authLogin', '#authPassword'].forEach(sel =>
    $(sel).addEventListener('input', gate));
  $('#next').addEventListener('click', async () => {
    const ok = await askConfirm({
      title: 'Submit requirements?',
      text: 'Step 2 starts: the refinement agent reads this form and begins asking questions. '
        + 'You cannot come back and edit it.',
      confirmLabel: 'Submit and continue' });
    if (!ok) return;
    lockPanel('Uploading and submitting…');
    const upload = async (cat, input) => {
      const names = [];
      for (const f of input.files) {
        await postJson('/api/upload',
          { taskId: activeTask, category: cat, filename: f.name, dataBase64: await toB64(f) });
        names.push(f.name);
      }
      return names;
    };
    const mockups = await upload('mockups', $('#mockups'));
    const contracts = await upload('contracts', $('#contracts'));
    const hints = await upload('hints', $('#hints'));
    // Credentials go straight to the server (auth.json); the step1 answer
    // only carries a flag so they never reach the orchestrator's context.
    const a = auth();
    if (a.complete) {
      await postJson('/api/auth',
        { taskId: activeTask, login: a.login, password: a.password });
    }
    await sendAnswer({ kind: 'step1',
      taskDescription: $('#task').value.trim(),
      businessRequirements: $('#biz').value.trim(),
      contractsText: $('#contractsText').value.trim(),
      hintsNote: $('#hintsNote').value.trim(),
      mockups, contracts, hints, authProvided: a.complete,
      generateMockups: $('#genMockups').checked });
  });
}

function renderQuestion(q, step) {
  // Steps 1-3 are the interactive ones — there an answer is confirmed before it is sent.
  // Step 5 only asks to retry the Chrome extension, which needs no gate.
  const confirmFirst = step.id <= 3;
  const submit = async (value, mark) => {
    if (confirmFirst && !await askConfirm({ title: 'Send this answer?', text: value,
      confirmLabel: 'Send answer' })) return;
    if (mark) mark();
    lockPanel('Answer sent — the agent is processing it…');
    sendAnswer({ kind: 'answer', questionId: q.id, value });
  };
  const opts = (q.options || []).map((o, i) =>
    `<button data-opt="${i}">${esc(o)}</button>`).join('');
  $('#panel').innerHTML = `
    <h2>${esc(step.name || STEP_NAMES[step.id - 1])}</h2>
    <p>${esc(q.text)}</p>
    <div class="options">${opts}</div>
    <label>…or type your own answer</label>
    <textarea id="freeAnswer"></textarea>
    <button id="send">Send answer</button>`;
  document.querySelectorAll('[data-opt]').forEach(btn =>
    btn.addEventListener('click', () =>
      submit(q.options[+btn.dataset.opt], () => btn.classList.add('selected'))));
  $('#send').addEventListener('click', () => {
    const v = $('#freeAnswer').value.trim();
    if (v) submit(v);
  });
}

function renderReview(review) {
  $('#panel').innerHTML = `
    <h2>Plan review</h2>
    <pre class="summary-text">${esc(review.text)}</pre>
    <button id="approve">Approve</button>
    <label>…or request changes</label>
    <textarea id="feedback"></textarea>
    <button id="sendFeedback" class="secondary">Send feedback</button>`;
  $('#approve').addEventListener('click', async () => {
    const ok = await askConfirm({
      title: 'Approve the plan?',
      text: 'The next step starts right away and agents begin changing files in your project.',
      confirmLabel: 'Approve and continue' });
    if (!ok) return;
    lockPanel('Approved — starting implementation…');
    sendAnswer({ kind: 'decision', decision: 'approve' });
  });
  $('#sendFeedback').addEventListener('click', () => {
    const t = $('#feedback').value.trim();
    if (!t) return;
    lockPanel('Feedback sent — the agent is revising the plan…');
    sendAnswer({ kind: 'decision', decision: 'feedback', text: t });
  });
}

function mockupUrl(review, screen) {
  return `/generated-mockups/${encodeURIComponent(activeTask)}/${
    encodeURIComponent(screen.file)}?rev=${review.rev || 0}`;
}

// The panel is ~930 px wide, so a 1280 px mockup is scaled down rather than
// letterboxed — otherwise the preview would misreport the layout.
function drawPreview(review) {
  const box = $('#preview');
  const screen = (review.screens || [])[viewOf(activeTask).mockupScreen];
  if (!box) return;
  if (!screen) {
    box.innerHTML = '<p class="muted">No screen to preview yet.</p>';
    return;
  }
  const [w, h] = MOCKUP_VIEWPORTS[viewOf(activeTask).mockupViewport];
  const scale = Math.min(1, (box.clientWidth || w) / w);
  const url = mockupUrl(review, screen);
  box.innerHTML = `
    <div class="frame" style="height:${Math.round(h * scale)}px">
      <iframe id="mockupFrame" src="${esc(url)}" sandbox="allow-scripts"
        style="width:${w}px;height:${h}px;transform:scale(${scale})"></iframe>
    </div>
    <p class="hint"><a href="${esc(url)}" target="_blank" rel="noopener">Open in a new tab ↗</a></p>`;
}

function renderMockupReview(review) {
  const screens = review.screens || [];
  const v = viewOf(activeTask);
  if (v.mockupScreen >= screens.length) v.mockupScreen = 0;
  const tabs = screens.map((s, i) =>
    `<button data-screen="${i}"${i === v.mockupScreen ? ' class="selected"' : ''}>${
      esc(s.title || s.id)}</button>`).join('');
  const viewports = Object.keys(MOCKUP_VIEWPORTS).map(vp =>
    `<button data-viewport="${vp}"${vp === v.mockupViewport ? ' class="selected"' : ''}>${
      vp}</button>`).join('');
  const chat = (review.chat || []).map(m =>
    `<div class="msg ${m.role === 'user' ? 'user' : 'agent'}">
      <span class="who">${m.role === 'user' ? 'You' : 'Agent'}</span>${esc(m.text)}</div>`).join('');
  $('#panel').innerHTML = `
    <h2>Mockups</h2>
    ${review.text ? `<pre class="summary-text">${esc(review.text)}</pre>` : ''}
    <div class="mockup-bar">
      <div class="tabs">${tabs || '<span class="muted">No screens yet</span>'}</div>
      <div class="tabs">${viewports}</div>
    </div>
    <div id="preview"></div>
    ${chat ? `<div class="chat">${chat}</div>` : ''}
    <label>Refine the mockup — describe what to change</label>
    <textarea id="mockupFeedback"></textarea>
    <button id="sendMockup" class="secondary">Send</button>
    <button id="approveMockup">Approve mockups</button>`;
  const select = (attr, apply) => document.querySelectorAll(`[data-${attr}]`).forEach(btn =>
    btn.addEventListener('click', () => {
      document.querySelectorAll(`[data-${attr}]`)
        .forEach(other => other.classList.toggle('selected', other === btn));
      apply(btn.dataset[attr]);
      drawPreview(review);
    }));
  select('screen', val => { v.mockupScreen = +val; });
  select('viewport', val => { v.mockupViewport = val; });
  $('#sendMockup').addEventListener('click', () => {
    const t = $('#mockupFeedback').value.trim();
    if (!t) return;
    lockPanel('Feedback sent — the agent is reworking the mockup…');
    sendAnswer({ kind: 'mockup', decision: 'feedback', text: t });
  });
  $('#approveMockup').addEventListener('click', async () => {
    const ok = await askConfirm({
      title: 'Approve the mockups?',
      text: 'They become the binding UI reference for the implementation and the visual baseline '
        + 'for the E2E comparison. Implementation starts next.',
      confirmLabel: 'Approve and continue' });
    if (!ok) return;
    lockPanel('Approved — the agent is updating spec, plan and checklist…');
    sendAnswer({ kind: 'mockup', decision: 'approve' });
  });
  drawPreview(review);
}

function renderProgress(step) {
  $('#panel').innerHTML = `
    <h2>${esc(step.name)}</h2>
    <div class="bar"><div id="barFill"></div></div>
    <div class="op" id="op"></div>
    <ul class="log" id="log"></ul>`;
  updateDynamic(step);
}

function updateDynamic(step) {
  const fill = $('#barFill');
  if (fill) {
    const indeterminate = step.progress == null && step.status === 'in_progress';
    fill.classList.toggle('indeterminate', indeterminate);
    fill.style.width = indeterminate ? '100%' : `${step.progress || 0}%`;
  }
  const op = $('#op');
  if (op) op.textContent = (step.progress != null ? `${step.progress}% — ` : '')
    + (step.currentOperation || '');
  const log = $('#log');
  if (log) log.innerHTML = step.log.slice(-15).reverse().map(e =>
    `<li><time>${esc(e.time.slice(11, 19))}</time>${esc(e.text)}</li>`).join('');
}

function renderFailed(step) {
  // Step 7 runs after the pipeline is already finished, so declining its retry drops
  // the user back on the summary instead of ending the run.
  const isMockoon = step.id === MOCKOON_STEP;
  $('#panel').innerHTML = `
    <h2>${esc(step.name)} — failed</h2>
    <pre class="report">${esc(step.report || 'No report provided.')}</pre>
    <button id="retry" class="danger">Retry step</button>
    <button id="${isMockoon ? 'backToSummary' : 'finish'}" class="secondary">${
      isMockoon ? 'Back to summary' : 'Finish'}</button>`;
  $('#retry').addEventListener('click', () => {
    lockPanel('Retrying the step…');
    sendAnswer({ kind: 'decision', decision: 'retry' });
  });
  if (isMockoon) {
    // The decision still goes out — it is what releases the orchestrator's failure gate.
    $('#backToSummary').addEventListener('click', () => {
      sendAnswer({ kind: 'decision', decision: 'finish' });
      backToSummary();
    });
    return;
  }
  $('#finish').addEventListener('click', () => {
    lockPanel('Finishing the pipeline…');
    sendAnswer({ kind: 'decision', decision: 'finish' });
  });
}

function backToSummary() {
  viewOf(activeTask).showSummary = true;
  tick();
}

// navigator.clipboard works on 127.0.0.1 (a secure context), but a denied permission
// or an older browser must still copy — hence the hidden-textarea fallback.
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return;
  } catch (_e) { /* fall through to the legacy path */ }
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  ta.remove();
}

function renderMockoon(step) {
  if (step.status !== 'completed') return renderProgress(step);
  $('#panel').innerHTML = `
    <h2>${esc(step.name)}</h2>
    <p class="muted">Import it in Mockoon (Import/export → Mockoon's format → from clipboard).
      The environment listens on <code>http://localhost:3000</code>.</p>
    <pre class="report" id="mockoonJson">Loading…</pre>
    <button id="copyMockoon" disabled>Copy JSON</button>
    <button id="backToSummary" class="secondary">Back to summary</button>`;
  $('#backToSummary').addEventListener('click', backToSummary);
  const copy = $('#copyMockoon');
  // The environment is fetched straight from the session dir, so nothing renders
  // it into the orchestrator's context on the way here.
  fetch(`/api/mockoon?taskId=${encodeURIComponent(activeTask)}`)
    .then(r => (r.ok ? r.text() : Promise.reject(new Error(String(r.status)))))
    .then(text => {
      $('#mockoonJson').textContent = text;
      copy.disabled = false;
      copy.addEventListener('click', async () => {
        await copyText(text);
        copy.textContent = 'Copied';
        setTimeout(() => { copy.textContent = 'Copy JSON'; }, 2000);
      });
    })
    .catch(() => {
      $('#mockoonJson').textContent = 'mockoon.json is missing — regenerate the mocks.';
    });
}

function renderSummary(task) {
  const sum = task.summary;
  const mockoon = task.steps.find(s => s.id === MOCKOON_STEP) || {};
  const hasMocks = mockoon.status === 'completed';
  const list = items => `<ul>${(items || []).map(i => `<li>${esc(i)}</li>`).join('')}</ul>`;
  const block = text => `<pre class="summary-text">${esc(text || '—')}</pre>`;
  $('#panel').innerHTML = `<div class="summary">
    <h2>Pipeline summary</h2>
    <section><h3>Final status</h3>
      <p class="status-final">${esc(sum.finalStatus || '')}</p></section>
    <section><h3>Changes</h3>${list(sum.changes)}</section>
    <section><h3>Implemented features</h3>${list(sum.features)}</section>
    <section><h3>Test results</h3>${block(sum.tests)}</section>
    <section><h3>API mocks</h3>${block(sum.apiMocks)}</section>
    <section><h3>Mockup comparison</h3>${block(sum.mockupComparison)}</section>
    <section><h3>UX review</h3>${block(sum.uxReview)}</section>
    <section><h3>Code review</h3>${block(sum.codeReview)}</section>
    <section id="mockoon-section"><h3>Mockoon mocks</h3>
      <p class="muted">A ready-to-import Mockoon environment for the feature's API,
        listening on <code>http://localhost:3000</code>.</p>
      ${hasMocks ? '<button id="showMockoon">Show Mockoon JSON</button>' : ''}
      <button id="generateMockoon"${hasMocks ? ' class="secondary"' : ''}>${
        hasMocks ? 'Regenerate' : 'Generate Mockoon mocks'}</button>
    </section>
    <section id="shutdown-section">
      <button id="shutdown" class="secondary">Shut down server</button>
    </section>
  </div>`;
  // Already generated: the JSON is one local switch away, no agent needed.
  if (hasMocks) {
    $('#showMockoon').addEventListener('click', () => {
      viewOf(activeTask).showSummary = false;
      tick();
    });
  }
  $('#generateMockoon').addEventListener('click', () => {
    lockPanel('Requested — the agent is building the Mockoon environment…');
    sendAnswer({ kind: 'summary', decision: 'mockoon' });
  });
  $('#shutdown').addEventListener('click', async () => {
    serverDown = true;
    $('#shutdown').disabled = true;
    // Ends the orchestrator's post-summary poll before the socket dies under it.
    try { await sendAnswer({ kind: 'summary', decision: 'shutdown' }); } catch (_e) { /* gone */ }
    try { await postJson('/api/shutdown', {}); } catch (_e) { /* server exits mid-response */ }
    $('#shutdown-section').innerHTML =
      '<p class="muted">Server stopped — you can close this tab.</p>';
  });
}

setInterval(tick, 1000);
tick();
</script>
</body>
</html>
