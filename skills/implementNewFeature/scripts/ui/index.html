// Instant click feedback: disable every control and show a spinner notice.
// The panel stays locked until the orchestrator changes the state (sig changes).
function lockPanel(message, remember = true) {
  if (remember) {
    const v = viewOf(activeTask);
    v.locked = message;
    v.lockedSig = lastSig;
  }
  document.querySelectorAll('#panel button, #panel textarea, #panel input, #panel select')
    .forEach(el => { el.disabled = true; });
  const n = document.createElement('div');
  n.className = 'notice';
  const spin = document.createElement('span');
  spin.className = 'spinner';
  const txt = document.createElement('span');
  txt.textContent = message;
  n.append(spin, txt);
  $('#panel').appendChild(n);
}

// Textareas grow with their content up to 45vh, then scroll — a pasted wall of
// text must never push the panel's buttons off screen.
function autoGrow(el) {
  el.style.height = 'auto';
  const border = el.offsetHeight - el.clientHeight;
  const max = Math.round(window.innerHeight * ((Number(el.dataset.maxVh) || 45) / 100));
  const want = el.scrollHeight + border;
  el.style.height = `${Math.min(want, max)}px`;
  el.style.overflowY = want > max ? 'auto' : 'hidden';
}

// A decorator rather than a change in every render function: every step's text
// fields get a copy button, including any field added later. Password fields opt
// out with data-no-copy, because revealing one flips its type to text.
function wireCopyButtons() {
  document.querySelectorAll('#panel textarea, #panel input[type=text]').forEach(el => {
    if (el.dataset.copyWired || el.dataset.noCopy) return;
    el.dataset.copyWired = '1';
    const wrap = document.createElement('div');
    wrap.className = 'copy-wrap';
    el.parentNode.insertBefore(wrap, el);
    wrap.appendChild(el);
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'copy';
    btn.innerHTML = COPY_ICON;
    btn.title = 'Copy field content';
    btn.setAttribute('aria-label', 'Copy field content');
    btn.addEventListener('click', async () => {
      await copyText(el.value);
      btn.innerHTML = CHECK_ICON;
      setTimeout(() => { btn.innerHTML = COPY_ICON; }, 2000);
    });
    wrap.appendChild(btn);
  });
}

function wireTextareas() {
  document.querySelectorAll('#panel textarea').forEach(el => {
    if (!el.dataset.autogrow) {
      el.dataset.autogrow = '1';
      el.addEventListener('input', () => autoGrow(el));
    }
    autoGrow(el);
  });
}

// A drag fires resize dozens of times a second and each pass forces a layout per
// textarea, so coalesce them into one measurement per frame.
let resizePending = false;
window.addEventListener('resize', () => {
  if (resizePending) return;
  resizePending = true;
  requestAnimationFrame(() => {
    resizePending = false;
    wireTextareas();
  });
});

async function tick() {
  if (serverDown) return;
  let state;
  try {
    state = await (await fetch('/api/state')).json();
  } catch (_e) {
    $('#panel').innerHTML = '<p class="muted">Server unreachable — retrying…</p>';
    lastSig = null;
    return;
  }
  if (!activeTask || !state.tasks.some(t => t.id === activeTask)) {
    activeTask = state.tasks[0].id;
    lastSig = null;
  }
  lastState = state;
  const taken = state.tasks.map(t => `${t.id}=${t.branch}`).join(',');
  if (taken !== takenBranches) {
    takenBranches = taken;
    if (refreshGate) refreshGate();
  }
  const task = state.tasks.find(t => t.id === activeTask);
  renderTabs(state);
  renderStepper(task);
  renderViewBar(task);
  renderPanel(state, task);
}

// Rebuilt every tick like the stepper — the bar holds no input, so a background
// task changing state never re-renders (and never clears) the open panel.
function renderTabs(state) {
  const box = $('#tabs');
  if (state.tasks.length < 2) {
    box.hidden = true;
    box.innerHTML = '';
    box.dataset.sig = '';
    return;
  }
  // Same reason as the stepper: only redraw when a tab actually changed, or the
  // rebuild would steal focus from a tab the user is on every single second.
  const sigNow = tabsSig(state);
  box.hidden = false;
  if (box.dataset.sig === sigNow) return;
  box.dataset.sig = sigNow;
  // The close control is a real button, so the tab itself cannot be one — nesting
  // interactive elements is invalid HTML and leaves the × unreachable by keyboard.
  box.innerHTML = state.tasks.map((t, i) => {
    const open = t.id === activeTask;
    // Step 1 in_progress is just an unsubmitted form, so the pipeline has started
    // once the form was submitted — that is what closes the × for good.
    const closable = !t.step1Submitted && t.steps.slice(1).every(s => s.status === 'waiting');
    return `<span class="tab${open ? ' selected' : ''}" role="tab"
      aria-selected="${open}" tabindex="0" data-task="${esc(t.id)}">
      <span class="dot ${activeStepOf(t).status}"></span>
      <span class="label">${esc(tabLabel(t, i))}</span>
      ${pending(t) && !open ? '<span class="pending" title="Waiting for you">●</span>' : ''}
      ${closable ? `<button type="button" class="close" data-close="${esc(t.id)}"
        aria-label="Close task" title="Close task">×</button>` : ''}
    </span>`;
  }).join('');
  box.setAttribute('role', 'tablist');
  box.querySelectorAll('[data-task]').forEach(el => {
    const open = () => {
      if (el.dataset.task === activeTask) return;
      snapshotStep1();
      activeTask = el.dataset.task;
      lastSig = null;
      tick();
    };
    el.addEventListener('click', open);
    el.addEventListener('keydown', e => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      e.preventDefault();
      open();
    });
  });
  box.querySelectorAll('[data-close]').forEach(el =>
    el.addEventListener('click', async e => {
      e.stopPropagation();   // the × sits inside the tab button
      const id = el.dataset.close;
      const ok = await askConfirm({ title: 'Close this task?',
        text: 'Its form and uploaded files are deleted. The task has not started yet.',
        confirmLabel: 'Close task' });
      if (!ok) return;
      await postJson('/api/tasks/remove', { taskId: id });
      if (id === activeTask) activeTask = null;
      lastSig = null;
      tick();
    }));
}

const tabsSig = state => state.tasks.map((t, i) => [t.id, tabLabel(t, i),
  activeStepOf(t).status, pending(t) ? '!' : '', t.step1Submitted ? 'S' : '',
  t.steps.slice(1).every(s => s.status === 'waiting') ? 'w' : '',
  t.id === activeTask ? '*' : ''].join(':')).join(',');

// A tab is named by whatever branch its form holds — the draft while it is being
// typed, the submitted value afterwards. Reading the live input instead would tie
// the bar's signature to the DOM the input handler patches, and the bar would
// rebuild on every keystroke, detaching the tabs under the user's cursor.
function tabLabel(task, i) {
  const draft = viewOf(task.id).draft;
  const typed = draft && String(draft.branch || '').trim();
  return typed || task.branch || `Task ${i + 1}`;
}

// Patch the open tab's label in place and keep the bar's signature in step, so
// typing a branch never triggers a rebuild.
function syncTabLabel() {
  const box = $('#tabs');
  if (!box || box.hidden || !lastState) return;
  const i = lastState.tasks.findIndex(t => t.id === activeTask);
  const label = box.querySelector(`.tab[data-task="${activeTask}"] .label`);
  if (i === -1 || !label) return;
  label.textContent = tabLabel(lastState.tasks[i], i);
  box.dataset.sig = tabsSig(lastState);
}

// Step ids are fixed, but the tiles follow the order the steps run in (STEP_ORDER),
// a disabled step (one whose switch on the form is off) is hidden, and the visible
// ones are numbered 1..n so the badges stay contiguous.
const rankOf = id => (STEP_ORDER.includes(id) ? STEP_ORDER.indexOf(id) : STEP_ORDER.length + id);
const shownSteps = task => task.steps.filter(s => s.enabled !== false)
  .sort((a, b) => rankOf(a.id) - rankOf(b.id));
function renderStepper(task) {
  // Rebuilding innerHTML every second would drop focus and restart the pulse
  // animation, so the tiles are redrawn only when something about them changed.
  const viewed = viewedStep(task);
  const sigNow = [task.id, viewed.id, shownSteps(task)
    .map(s => `${s.id}:${s.status}`).join(',')].join('|');
  const box = $('#stepper');
  if (box.dataset.sig === sigNow) return;
  box.dataset.sig = sigNow;
  box.innerHTML = shownSteps(task).map((s, i) => {
    const name = esc(s.name || STEP_NAMES[s.id - 1]);
    const nav = visitable(s);
    return `
    <div class="step ${s.status}${nav ? ' clickable' : ''}${s.id === viewed.id ? ' viewing' : ''}"
      data-step="${s.id}"${nav ? ` role="button" tabindex="0" aria-label="Go to ${name}"` : ''}>
      <span class="num">${i + 1}</span>
      <span class="name">${name}</span>
      <span class="badge">${BADGE[s.status] || s.status}</span>
    </div>`;
  }).join('');
  box.querySelectorAll('.step.clickable').forEach(el => {
    const go = () => gotoStep(+el.dataset.step);
    el.addEventListener('click', go);
    el.addEventListener('keydown', e => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      e.preventDefault();
      go();
    });
  });
}

const activeStepOf = task =>
  task.steps.find(s => s.id === task.activeStep) || task.steps[0];

// A step the pipeline has already opened can be revisited; one it never reached
// has no panel to show. A step whose switch is off stays unreachable.
const visitable = step => step.enabled !== false && step.status !== 'waiting';

// The step whose panel is on screen: the user's own pick while it still holds,
// otherwise wherever the pipeline is.
function viewedStep(task) {
  const v = viewOf(task.id);
  const picked = v.viewStep && task.steps.find(s => s.id === v.viewStep);
  if (picked && visitable(picked)) return picked;
  v.viewStep = null;
  return activeStepOf(task);
}

// Navigation is page state and nothing else: no answer is posted, so neither the
// orchestrator nor any agent learns that the user looked at another step.
function gotoStep(id) {
  const task = currentTask();
  if (!task) return;
  const v = viewOf(task.id);
  snapshotStep1();
  // Step 7's panel and the summary share the screen — picking the tile means the panel.
  if (id === MOCKOON_STEP) v.showSummary = false;
  // Clicking the step the pipeline is on hands the view back to it; with a summary
  // on screen every tile is a pick, because the summary is what following means.
  v.viewStep = id === task.activeStep && !task.summary ? null : id;
  lastSig = null;
  tick();
}

// Only while the user is off the pipeline's own step — it is the way back.
function renderViewBar(task) {
  const box = $('#viewbar');
  const v = viewOf(task.id);
  const viewed = viewedStep(task);
  const followed = task.summary ? null : activeStepOf(task);
  const name = s => esc(s.name || STEP_NAMES[s.id - 1]);
  const sigNow = v.viewStep == null ? ''
    : [task.id, viewed.id, followed ? followed.id : 'S', pending(task) ? '!' : ''].join('|');
  if (box.dataset.sig === sigNow) return;
  box.dataset.sig = sigNow;
  if (v.viewStep == null) {
    box.hidden = true;
    box.innerHTML = '';
    return;
  }
  box.hidden = false;
  box.innerHTML = `<span>Viewing <b>${name(viewed)}</b> — ${followed
    ? `the pipeline is on <b>${name(followed)}</b>${
      pending(task) ? ' and is waiting for you' : ''}.`
    : 'the pipeline has finished.'}</span>
    <button id="goCurrent" class="secondary">${
  followed ? 'Go to current' : 'Back to summary'}</button>`;
  $('#goCurrent').addEventListener('click', () => {
    v.viewStep = null;
    if (task.summary) v.showSummary = true;
    lastSig = null;
    tick();
  });
}

// A task stopped at a gate, waiting for the user rather than for an agent.
const pending = task => !!(task.question || task.reviewSummary || task.mockupReview);

// Whether this step is the one the pipeline is on — so its buttons answer something
// and its composer reaches an agent. Step 7 is the exception on the summary test: its
// gate opens after the summary is written.
const liveOf = (task, step) =>
  step.id === task.activeStep && (step.id === MOCKOON_STEP || !task.summary);

function sig(task) {
  const v = viewOf(task.id);
  const step = viewedStep(task);
  const mockoon = task.steps.find(s => s.id === MOCKOON_STEP);
  return [task.id, step.id, task.activeStep, step.status,
    task.question ? `q${task.questionSeq || 0}` : '',
    // rev changes on every agent round, so a revised plan replaces the one on
    // screen instead of leaving stale text under a gate the user is answering.
    task.reviewSummary ? `r${task.reviewSummary.rev || 0}` : '',
    // Same for the mockups, where it also clears the lock left by an Approve.
    task.mockupReview ? `m${task.mockupReview.rev || 0}` : '',
    task.summary ? '1' : '',
    // The Mockoon step changes status while the summary is the visible screen,
    // and the switch between the two screens is local — both must re-render.
    mockoon ? mockoon.status : '', v.showSummary ? 'S' : '',
    // Stepping off the pipeline's own step is a different screen, and so is coming back.
    v.viewStep == null ? '' : 'V'].join('|');
}

function renderPanel(state, task) {
  const v = viewOf(task.id);
  const mockoon = task.steps.find(s => s.id === MOCKOON_STEP);
  // A fresh Mockoon run always pulls the user back onto its panel, whatever they
  // were looking at when they asked for it.
  if (mockoon && mockoon.status === 'in_progress') {
    v.showSummary = false;
    v.viewStep = null;
  }
  const s = sig(task);
  const step = viewedStep(task);
  if (s === lastSig) { updateDynamic(task, step); return; }
  lastSig = s;
  renderActive(task, step);
  wireCopyButtons();
  wireTextareas();
  // The orchestrator has not moved this task since the answer went out, so the
  // panel goes back under its lock instead of offering the button again.
  if (v.locked && v.lockedSig === s) lockPanel(v.locked, false);
  else { v.locked = null; v.lockedSig = null; }
}

function renderActive(task, step) {
  refreshGate = null;
  refreshRuns = null;
  const v = viewOf(task.id);
  // A gate only answers while the orchestrator is actually waiting at it, so a
  // step revisited after the fact shows its panel without its buttons. Step 7 is
  // the exception on the summary test: its gate opens after the summary is written.
  const live = liveOf(task, step);
  // Mockoon mocks are generated after the pipeline is over, so while step 7 is the
  // one on screen its panel outranks the summary — until the user asks to go back.
  if (step.id === MOCKOON_STEP && !v.showSummary) {
    return step.status === 'failed' ? renderFailed(step, live) : renderMockoon(task, step);
  }
  // The summary is what following the pipeline means once it is written; a step
  // the user picked for themselves outranks it.
  if (task.summary && v.viewStep == null) return renderSummary(task);
  if (step.status === 'failed') return renderFailed(step, live);
  // A question carries no step of its own — it belongs to whatever step is running.
  if (task.question && live) return renderQuestion(task.question, step);
  if (step.id === 1) return renderStep1(task);
  // The plan and the story are approved at the same gate, on whichever of the two steps
  // the pipeline is on - a story gate must not show up on the finished refinement.
  if ((step.id === 2 || step.id === STORY_STEP) && task.reviewSummary && live) {
    return renderReview(task.reviewSummary, step);
  }
  if (step.id === 3 && task.mockupReview) return renderMockupReview(task.mockupReview, step);
  if (step.id === STORY_STEP && step.status === 'completed') return renderStory(task, step);
  renderProgress(task, step);
}

function renderStep1(task) {
  const step = task.steps[0];
  if (step.status === 'waiting') {
    $('#panel').innerHTML = '<p class="muted">Waiting for the pipeline…</p>';
    return;
  }
  // The form is rebuilt from the last submitted (or copied) answer, so a task the
  // user came back to arrives filled in rather than blank.
  // An unsubmitted draft outranks the last submission for the text fields; the
  // file lists always come from the server, which is what actually holds them.
  const v = viewOf(task.id);
  const d = { ...(task.step1 || {}), ...(v.draft || {}) };
  const revisit = !!task.step1Submitted;
  // The agent settings and the credentials are the two things this browser carries
  // over from the last run; both only ever fill a form that has nothing of its own.
  const ag = agentsForForm(task, d);
  const stored = readStore(authKey(), null);
  // The fields are only ever filled on a form that was never submitted: doing it on a
  // revisit would make the form differ from what was sent and offer to resubmit
  // over a change the user never made.
  const savedAuth = revisit ? null : stored;
  // The switch says what is actually kept - unless the user has just moved it, which
  // the draft holds. Without that, unticking would spring back on the next redraw and
  // the following submit would store the password they had just refused to store.
  const remember = d.rememberAuth !== undefined ? !!d.rememberAuth : (stored ? true : !revisit);
  // Implementation is the point of no return for what the task is: from there the
  // description, branch, steps and files are the record of what was asked for, not
  // something the pipeline can still be sent back over. The settings stay open until
  // the summary, because the steps still ahead read them when they start.
  const frozen = revisit
    && ((task.steps.find(s => s.id === 4) || {}).status !== 'waiting' || !!task.summary);
  const finished = revisit && !!task.summary;
  // A draft typed before the freeze would put text on screen that can no longer be sent,
  // and make a settings-only form look as if it changed the task.
  if (frozen) {
    for (const key of STEP1_FLOW) d[key] = (task.step1 || {})[key];
    v.picked = null;
    v.filesDirty = false;
  }
  const pickedOf = cat => (v.picked || {})[cat] || [];
  // Files already on disk cannot be put back into a file input, so they are listed
  // separately and removed through the server.
  const fileList = cat => {
    const names = d[cat] || [];
    return names.length ? `<ul class="files" id="files-${cat}">${names.map(n =>
      `<li><span class="file">${IMAGE_RE.test(n) ? thumbHtml(uploadUrl(cat, n), n) : ''}<span>${
        esc(n)}</span></span><button type="button" class="rm" data-cat="${esc(cat)}"
        data-name="${esc(n)}" aria-label="Remove ${esc(n)}" title="Remove">×</button></li>`)
      .join('')}</ul>` : '';
  };
  // A draft's runs, else the last submission's, else the two passes the step always ran.
  const runs = d.codeReview && d.codeReview.length ? d.codeReview : reviewRunsDefault;
  const toggle = (id, on, label, hint) => `<div>
      <div class="switch">
        <input type="checkbox" id="${id}"${on ? ' checked' : ''}>
        <label for="${id}">${label}</label>
      </div>
      <p class="hint">${hint}</p>
    </div>`;
  $('#panel').innerHTML = `
    <h2>Requirements</h2>
    <label>Task description <span class="req">*</span></label>
    <textarea id="task" placeholder="What to build and why: the feature, the business requirements behind it, any constraints">${
  esc(d.taskDescription || '')}</textarea>
    ${fileList('images')}
    <ul class="files picked" id="picked-images"></ul>
    <div class="attach-row">
      <button type="button" id="attachImages" class="secondary attach-btn"
        aria-label="Attach images" title="Attach images">${CLIP_ICON}</button>
      <span class="muted">Screenshots or sketches that show what the description means — every
        agent that reads the description sees them too.</span>
      <input type="file" id="images" multiple accept="image/*" hidden>
    </div>
    <label>Branch <span class="req">*</span></label>
    <input type="text" id="branch" placeholder="feature/my-feature" autocomplete="off"
      value="${esc(d.branch || '')}">
    <p class="hint error" id="branchHint" hidden></p>
    <h3>Steps before implementation</h3>
    <div class="switch-row">
      ${toggle('refinement', d.refinement !== false, 'Feature refinement',
    'An agent asks you questions, then writes the spec, the plan and the checklist you approve'
    + ' before anything is built.')}
      ${toggle('genMockups', !!d.generateMockups, 'Generate mockups',
    'An agent designs the screens from the refined plan (else from the task description) and'
    + ' the files below, and you refine them in a chat. The approved design drives the'
    + ' implementation and the visual E2E comparison.')}
      ${toggle('storyDesc', !!d.storyDescription, 'Story description',
    'An agent writes a Jira-style story, a short description with acceptance criteria, from'
    + ' what the steps before it produced, else from this form.')}
    </div>
    <h3>Code review</h3>
    <p class="muted">How many times the review step runs <code>/doh:codeReview</code> on the
      task's changes, and with which flags; hover a flag to see what it does. A run that finds
      nothing ends the review, and the runs after it are skipped.</p>
    <div id="reviewRuns">${runsHtml(runs)}</div>
    <button type="button" id="addRun" class="secondary">Add run</button>
    <h3>Agent</h3>
    <p class="muted">Which model this task's sub-agents run on, and how much thinking they
      are asked for. Both bind when a step's agent is spawned, so a change here reaches
      the steps that have not started yet — never the one already running.</p>
    <div class="agent-row">
      <div><label for="agentModel">Model</label>
        ${agentSelect('agentModel', agentModels(), ag.model)}</div>
      <div><label for="agentEffort">Effort</label>
        ${agentSelect('agentEffort', AGENT_EFFORTS, ag.effort)}</div>
    </div>
    <details class="overrides" id="agentOverrides">
      <summary>Per-step overrides</summary>
      <div class="agent-grid">
        ${AGENT_STEPS.map(n => `<span>${esc(STEP_NAMES[n - 1])}</span>
          ${agentSelect(`agentModel-${n}`, agentModels(), ag.steps[n].model)}
          ${agentSelect(`agentEffort-${n}`, AGENT_EFFORTS, ag.steps[n].effort)}`).join('')}
      </div>
    </details>
    <h3>Additional materials (optional)</h3>
    <p class="muted">Inspirations, screenshots of another app, diagrams, exported designs —
      anything that should guide the refinement questions and the mockup design.</p>
    <label>Files</label>
    ${fileList('hints')}
    <ul class="files picked" id="picked-hints"></ul>
    <input type="file" id="hints" multiple>
    <div id="hintsNoteBox"${(d.hints || []).length ? '' : ' hidden'}>
      <label>What should we take from these files?</label>
      <textarea id="hintsNote"
        placeholder="e.g. copy the card layout from screen 2, ignore the colors">${
  esc(d.hintsNote || '')}</textarea>
    </div>
    <label>Mockups (optional)</label>
    ${fileList('mockups')}
    <ul class="files picked" id="picked-mockups"></ul>
    <input type="file" id="mockups" multiple accept="image/*,.pdf">
    <label>API contracts / specs (optional — files or pasted text)</label>
    ${fileList('contracts')}
    <ul class="files picked" id="picked-contracts"></ul>
    <input type="file" id="contracts" multiple>
    <textarea id="contractsText" placeholder="…or paste contracts here">${
  esc(d.contractsText || '')}</textarea>
    <h3>Authorization (optional)</h3>
    <p class="muted">Credentials for E2E tests only — stored in the session dir, outside git.</p>
    ${task.authSaved ? '<p class="hint">Credentials are stored for this task — fill both fields'
      + ' to replace them.</p>' : ''}
    <label>Login</label>
    <input type="text" id="authLogin" autocomplete="off">
    <label>Password</label>
    <div class="field-with-btn">
      <input type="password" id="authPassword" autocomplete="new-password" data-no-copy="1">
      <button type="button" id="togglePassword" class="reveal" aria-pressed="false"
        aria-label="Show password" title="Show password">${EYE}</button>
    </div>
    <div class="switch">
      <input type="checkbox" id="rememberAuth"${remember ? ' checked' : ''}>
      <label for="rememberAuth">Remember on this browser</label>
    </div>
    <p class="hint">Kept in this browser's storage for this project only, so the next task and
      the next run start with them filled in. Unticking this deletes them right away; the
      run's own copy still dies with the pipeline.</p>
    ${finished ? '<p class="hint">The pipeline has finished — the requirements are the record of'
      + ' this task now. Copy it from the sidebar to take the feature in another direction.</p>'
      : `${frozen ? `<p class="hint" id="frozenHint">Implementation has started — the description,
      branch, steps and files are frozen for this task; copy it from the sidebar to take the
      feature in another direction. The code review, agent and authorization settings can still
      change: the steps that have not started yet pick them up.</p>` : ''}
    <button id="next" disabled>${frozen ? 'Save settings' : revisit ? 'Resubmit' : 'Next'}</button>
    <p class="hint" id="changeHint" hidden>${frozen
    ? 'Nothing changed yet — edit the code review, agent or authorization settings to save them.'
    : `Nothing changed yet — edit a field, add or remove a file, or fill in credentials to
      resubmit.`}</p>`}`;
  // What the markup above cannot carry: credentials are deliberately absent from the
  // state document, and a FileList cannot be written as an attribute. Both are what a
  // redraw used to drop, so both are put back by hand.
  // A draft outranks storage: what is half-typed is newer than what was saved.
  $('#authLogin').value = d.authLogin !== undefined ? d.authLogin
    : (savedAuth && savedAuth.login) || '';
  $('#authPassword').value = d.authPassword !== undefined ? d.authPassword
    : (savedAuth && savedAuth.password) || '';
  // The files picked since the last submit, each with its own ×. The input is only the
  // picker: a pick is added to the ones before it, so a second trip never loses the first.
  const drawPicked = cat => {
    $(`#picked-${cat}`).innerHTML = pickedOf(cat).map((f, i) =>
      `<li title="Uploaded when you submit"><span class="file">${
        IMAGE_RE.test(f.name) ? thumbHtml(fileUrl(f), f.name) : ''}<span>${esc(f.name)}</span></span>
      <button type="button" class="rm" data-unpick="${i}" aria-label="Remove ${esc(f.name)}"
        title="Remove">×</button></li>`).join('');
    $(`#picked-${cat}`).querySelectorAll('[data-unpick]').forEach(btn =>
      btn.addEventListener('click', () => {
        const list = pickedOf(cat);
        dropFileUrl(list[+btn.dataset.unpick]);
        v.picked = { ...v.picked, [cat]: list.filter((_, j) => j !== +btn.dataset.unpick) };
        drawPicked(cat);
        onEdit();
      }));
    // The note only makes sense once there is something to describe, so it stays hidden
    // until the first file is picked, and goes again when the last one is removed.
    $('#hintsNoteBox').hidden = !(pickedOf('hints').length || (d.hints || []).length);
  };
  for (const cat of STEP1_FILES) {
    drawPicked(cat);
    $(`#${cat}`).addEventListener('change', () => {
      const input = $(`#${cat}`);
      // The description takes pictures only, whatever the picker was switched to.
      const fresh = [...input.files].filter(f => cat !== 'images' || IMAGE_RE.test(f.name));
      // The same name picked again replaces the earlier pick, as the upload would on disk.
      const replaced = pickedOf(cat).filter(f => fresh.some(n => n.name === f.name));
      replaced.forEach(dropFileUrl);
      v.picked = { ...(v.picked || {}),
        [cat]: [...pickedOf(cat).filter(f => !replaced.includes(f)), ...fresh] };
      input.value = '';
      drawPicked(cat);
      onEdit();
      wireCopyButtons();
      wireTextareas();
    });
  }
  $('#attachImages').addEventListener('click', () => $('#images').click());
  $('#togglePassword').addEventListener('click', () => {
    const input = $('#authPassword');
    const btn = $('#togglePassword');
    const reveal = input.type === 'password';
    input.type = reveal ? 'text' : 'password';
    btn.innerHTML = reveal ? EYE_OFF : EYE;
    btn.setAttribute('aria-pressed', String(reveal));
    btn.setAttribute('aria-label', reveal ? 'Hide password' : 'Show password');
    btn.setAttribute('title', reveal ? 'Hide password' : 'Show password');
    input.focus();
  });
  // The server owns the file lists, so a removal re-renders from the new state.
  document.querySelectorAll('#panel .rm[data-cat]').forEach(btn =>
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      await postJson('/api/upload/remove',
        { taskId: activeTask, category: btn.dataset.cat, filename: btn.dataset.name });
      if (revisit) v.filesDirty = true;
      lastSig = null;
      tick();
    }));
  // The flag list can land after the form, and a run can be added or removed: each one
  // redraws the cards from what is on screen, so no tick is lost on the way.
  const drawRuns = list => {
    $('#reviewRuns').innerHTML = runsHtml(list);
    wireRuns();
  };
  const wireRuns = () => {
    $('#addRun').disabled = finished || runsOnScreen().length >= reviewRunsMax;
    if (finished) {
      document.querySelectorAll('#reviewRuns input, #reviewRuns button')
        .forEach(el => { el.disabled = true; });
      return;
    }
    document.querySelectorAll('#reviewRuns input')
      .forEach(el => el.addEventListener('change', () => onEdit()));
    document.querySelectorAll('#reviewRuns .run-rm').forEach(btn =>
      btn.addEventListener('click', () => {
        const list = runsOnScreen();
        list.splice(Number(btn.dataset.run), 1);
        drawRuns(list);
        onEdit();
      }));
  };
  wireRuns();
  refreshRuns = () => drawRuns(runsOnScreen());
  if (finished) {
    document.querySelectorAll('#panel textarea, #panel input, #panel select, #panel .rm, #attachImages')
      .forEach(el => { el.disabled = true; });
    return;
  }
  // After implementation has started only the settings are live; the server refuses
  // anything else with a 409, so the form does not offer it.
  if (frozen) {
    ['#task', '#branch', '#refinement', '#genMockups', '#storyDesc', '#contractsText', '#hintsNote',
      '#attachImages', ...STEP1_FILES.map(cat => `#${cat}`)].forEach(sel => { $(sel).disabled = true; });
    document.querySelectorAll('#panel .rm').forEach(el => { el.disabled = true; });
  }
  $('#addRun').addEventListener('click', () => {
    const list = runsOnScreen();
    // A run after the first re-reviews what the one before it fixed.
    const since = !reviewFlags || reviewFlags.some(f => f.name === '--since-last');
    list.push({ flags: since ? ['--since-last'] : [] });
    drawRuns(list);
    onEdit();
  });
  const auth = () => {
    const login = $('#authLogin').value.trim();
    const password = $('#authPassword').value;
    return { login, password, complete: !!(login && password.trim()) };
  };
  // Walking back to the form to re-read it is free; re-running refinement is not,
  // so a resubmission has to carry something the agents have not seen. What the task
  // is and how it is run are told apart, because only the first repeats anything.
  const flowEdited = () => {
    if (v.filesDirty || STEP1_FILES.some(cat => pickedOf(cat).length)) return true;
    const prev = task.step1 || {};
    const same = (sel, key) => $(sel).value.trim() === String(prev[key] || '').trim();
    return !(same('#task', 'taskDescription')
      && same('#branch', 'branch') && same('#contractsText', 'contractsText')
      && same('#hintsNote', 'hintsNote')
      && $('#refinement').checked === (prev.refinement !== false)
      && $('#genMockups').checked === !!prev.generateMockups
      && $('#storyDesc').checked === !!prev.storyDescription);
  };
  const settingsEdited = () => {
    const a = auth();
    if (a.login || a.password) return true;
    const prev = task.step1 || {};
    return JSON.stringify(runsOnScreen()) !== JSON.stringify(prev.codeReview || reviewRunsDefault)
      || JSON.stringify(agentsOnScreen()) !== JSON.stringify(agentsOf({ agents: prev.agents }));
  };
  const changed = () => flowEdited() || settingsEdited();
  const gate = () => {
    const a = auth();
    const branch = $('#branch').value.trim();
    // Two tasks cannot share a branch: step 4 would fail on `git worktree add`,
    // and only then — after refinement, mockups and a plan. Say so here instead.
    const taken = (lastState ? lastState.tasks : [])
      .some(t => t.id !== task.id && t.branch && t.branch === branch);
    const problem = !branch ? ''
      : !branchOk(branch) ? 'Not a valid git branch name.'
        : taken ? 'Another task is already using this branch.' : '';
    $('#branchHint').textContent = problem;
    $('#branchHint').hidden = !problem;
    // Auth is all-or-nothing: filling exactly one of the two fields blocks Next.
    const valid = !!($('#task').value.trim()
      && branchOk(branch) && !taken
      && (a.complete || (!a.login && !a.password.trim())));
    const dirty = !revisit || changed();
    $('#next').disabled = !(valid && dirty);
    $('#changeHint').hidden = !(valid && !dirty);
  };
  // The draft is kept in step with every edit rather than only at the redraws we know
  // about: a removed file, a failing step, a question arriving — any of them replaces
  // the panel, and only what was put away survives it.
  const onEdit = () => { snapshotStep1(); gate(); };
  ['#task', '#branch', '#authLogin', '#authPassword', '#contractsText', '#hintsNote']
    .forEach(sel => $(sel).addEventListener('input', onEdit));
  ['#refinement', '#genMockups', '#storyDesc']
    .forEach(sel => $(sel).addEventListener('change', onEdit));
  document.querySelectorAll('#panel select').forEach(el => el.addEventListener('change', () => {
    onEdit();
    // Remembered as soon as it is picked, not on submit: the point is that the next
    // form starts there, whether or not this one is ever sent.
    writeStore(LS_AGENTS, agentsOnScreen());
  }));
  // Unticking is a delete, and it happens now rather than at the next submit - a
  // switch that only takes effect later is not a way to remove a stored password.
  $('#rememberAuth').addEventListener('change', () => {
    if ($('#rememberAuth').checked) return;
    writeStore(authKey(), null);
    $('#authLogin').value = '';
    $('#authPassword').value = '';
    onEdit();
  });
  gate();   // a form that arrived filled in must enable Next without a keystroke
  refreshGate = gate;
  // The tab's label is the branch being typed, and onEdit above has already put it in
  // the draft the label reads — so it can follow along without the bar re-rendering.
  $('#branch').addEventListener('input', syncTabLabel);
  $('#next').addEventListener('click', async () => {
    // What runs next depends on the switches, and with all three off the next step is
    // implementation itself - the one after which this form can no longer be resubmitted.
    const next = $('#refinement').checked
      ? 'Refinement starts: its agent reads this form and begins asking questions.'
      : $('#genMockups').checked ? 'Mockups start: an agent designs the screens from this form.'
        : $('#storyDesc').checked ? 'The story starts: an agent writes it from this form.' : '';
    // A resubmission that only touches the settings repeats nothing, so it is not
    // dressed up as one that sends the pipeline back.
    const settingsOnly = revisit && !flowEdited();
    const ok = await askConfirm(settingsOnly ? {
      title: 'Save the new settings?',
      text: 'Nothing is repeated. The steps that have not started yet use them; a code review '
        + 'already under way finishes the run it is on, and the runs after it follow the new list.',
      confirmLabel: 'Save settings' } : {
      title: revisit ? 'Resubmit the requirements?' : 'Submit requirements?',
      text: !next ? 'Implementation starts right away, and the requirements are frozen from then on.'
        : revisit
          ? 'Only what the change touches is repeated: the pipeline goes back to the first step '
            + 'that has to see it, and that step and the ones after it run again. A change no step '
            + 'before implementation reads repeats nothing. You can come back here again until '
            + 'implementation starts.'
          : `${next} You can come back and edit it until implementation starts.`,
      confirmLabel: revisit ? 'Resubmit and continue' : 'Submit and continue' });
    if (!ok) return;
    lockPanel('Uploading and submitting…');
    // Refused or unreachable: the form comes back as it was, the draft and the picks with
    // it, and the error bar says why.
    const giveBack = () => {
      v.locked = null;
      v.lockedSig = null;
      lastSig = null;
      tick();
    };
    const upload = async cat => {
      const names = [];
      for (const f of pickedOf(cat)) {
        const res = await postJson('/api/upload',
          { taskId: activeTask, category: cat, filename: f.name, dataBase64: await toB64(f) });
        if (!res.ok) return null;
        names.push(res.name || f.name);
      }
      return names;
    };
    // Files kept from the previous submission plus the ones just picked; a
    // re-upload of the same name overwrites on disk, so the list is deduped.
    const uploaded = {};
    for (const cat of STEP1_FILES) {
      uploaded[cat] = await upload(cat);
      if (!uploaded[cat]) return giveBack();
    }
    const keep = cat => [...new Set([...(d[cat] || []), ...uploaded[cat]])];
    // Credentials go straight to the server (auth.json); the step1 answer
    // only carries a flag so they never reach the orchestrator's context.
    const a = auth();
    if (a.complete) {
      await postJson('/api/auth',
        { taskId: activeTask, login: a.login, password: a.password });
    }
    // Under the project's own key: one fixed port means one origin for every project
    // on this machine, and these are the credentials of exactly one of them.
    if ($('#rememberAuth').checked && a.complete) {
      writeStore(authKey(), { login: a.login, password: a.password });
    }
    const sent = await sendAnswer({ kind: 'step1',
      taskDescription: $('#task').value.trim(),
      branch: $('#branch').value.trim(),
      contractsText: $('#contractsText').value.trim(),
      hintsNote: $('#hintsNote').value.trim(),
      mockups: keep('mockups'), contracts: keep('contracts'), hints: keep('hints'),
      images: keep('images'),
      authProvided: a.complete || task.authSaved,
      refinement: $('#refinement').checked,
      generateMockups: $('#genMockups').checked,
      storyDescription: $('#storyDesc').checked,
      codeReview: runsOnScreen(),
      agents: agentsOnScreen() });
    if (!sent.ok) return giveBack();
    // The form is the server's now, credentials included — nothing of it stays on
    // the page, or the next redraw would hand back files that were already uploaded.
    STEP1_FILES.forEach(cat => pickedOf(cat).forEach(dropFileUrl));
    v.draft = null;
    v.picked = null;
    v.filesDirty = false;
    // Submitting means "go", so the view rejoins the pipeline wherever it now is. On a
    // resubmission the server has already moved it - back to the first step that repeats,
    // the ones after it waiting again, or nowhere when nothing does - so the page follows
    // at once instead of on the next poll.
    v.viewStep = null;
    lastSig = null;
    tick();
  });
}

// A shortcut to the stepper's own first tile, offered on the interactive
// gates. It only changes what is on screen: the gate stays open, the agents hear
// nothing, and the switched-on steps before implementation re-run only if the form
// comes back actually changed.
const backButton = () => '<button id="backToStep1" class="secondary">Back to requirements</button>';

function wireBackButton() {
  const btn = $('#backToStep1');
  if (!btn) return;
  btn.addEventListener('click', () => gotoStep(1));
}

// A line of a conversation, with the pictures that went with it.
const msgHtml = (role, text, attachments) =>
  `<div class="msg ${role === 'user' ? 'user' : 'agent'}">
    <span class="who">${role === 'user' ? 'You' : 'Agent'}</span>${esc(text)}${
  (attachments || []).length ? `<div class="thumbs">${attachments.map(n =>
    thumbHtml(uploadUrl(ATTACHMENTS, n), n)).join('')}</div>` : ''}</div>`;

// The pictures that go with a message, on the three steps before implementation: picked
// into a tray above the field, kept with the draft so a redraw hands them back, and
// uploaded only when the message goes out.
const attachButton = key => `<button type="button" class="secondary attach-btn"
    data-attach="${key}" aria-label="Attach images" title="Attach images">${CLIP_ICON}</button>
  <input type="file" accept="image/*" multiple hidden data-attach-input="${key}">`;
const attachTray = key => `<div class="thumbs" data-attach-tray="${key}"></div>`;
const attachedOf = key => viewOf(activeTask).attach[key] || [];

// Wires one picker and its tray. Returns what a send calls first: it uploads the tray
// and resolves to the stored names - or to null when an upload failed, and then the
// message is not sent at all, so its text and pictures stay where they are.
function wireAttach(key) {
  const btn = document.querySelector(`[data-attach="${key}"]`);
  if (!btn) return async () => [];
  const v = viewOf(activeTask);
  const input = document.querySelector(`[data-attach-input="${key}"]`);
  const tray = document.querySelector(`[data-attach-tray="${key}"]`);
  const draw = () => {
    tray.innerHTML = attachedOf(key).map((f, i) => `<span class="att">${thumbHtml(fileUrl(f), f.name)}
      <button type="button" class="rm" data-detach="${i}" aria-label="Remove ${esc(f.name)}"
        title="Remove">×</button></span>`).join('');
    tray.querySelectorAll('[data-detach]').forEach(x => x.addEventListener('click', () => {
      dropFileUrl(attachedOf(key)[+x.dataset.detach]);
      v.attach[key] = attachedOf(key).filter((_, j) => j !== +x.dataset.detach);
      draw();
    }));
    btn.disabled = attachedOf(key).length >= MAX_ATTACHMENTS;
  };
  btn.addEventListener('click', () => input.click());
  input.addEventListener('change', () => {
    const images = [...input.files].filter(f => IMAGE_RE.test(f.name));
    v.attach[key] = [...attachedOf(key), ...images].slice(0, MAX_ATTACHMENTS);
    input.value = '';
    draw();
  });
  draw();
  return async () => {
    const names = [];
    for (const f of attachedOf(key)) {
      const res = await postJson('/api/upload', { taskId: activeTask, category: ATTACHMENTS,
        filename: f.name, dataBase64: await toB64(f) });
      if (!res.ok) return null;
      names.push(res.name);
    }
    attachedOf(key).forEach(dropFileUrl);
    v.attach[key] = [];
    draw();
    return names;
  };
}

// Every agent step can be stopped while it runs. The server fails it on the spot, so the
// failure gate - Retry or Finish - is on screen before the orchestrator has even heard.
const stoppable = step => {
  const task = currentTask();
  return !!task && step.id !== 1 && step.status === 'in_progress' && liveOf(task, step);
};
// The step's title, with the Stop button beside it while there is something to stop.
const panelHead = (title, step) => `<div class="panel-head"><h2>${title}</h2>${
  stoppable(step) ? '<button type="button" id="stopStep" class="danger">Stop</button>' : ''}</div>`;
function wireStop(step) {
  const btn = $('#stopStep');
  if (!btn) return;
  btn.addEventListener('click', async () => {
    const ok = await askConfirm({ title: 'Stop this step?',
      text: 'Its agent is interrupted at once and the step is marked as stopped. Retry runs it '
        + 'again; Finish ends the pipeline there.',
      confirmLabel: 'Stop the step' });
    if (!ok) return;
    lockPanel('Stopping the step…');
    await sendAnswer({ kind: 'stop', step: step.id });
    tick();
  });
}

// What belongs to the panel on screen rather than to the task: the messages already
// sent from it and the one still half-typed in it. A tab switch, a walk back to the
// requirements and a poll all redraw the same panel — same signature — and both have
// to come back. A new question or a revised plan is a different panel, and both start
// empty, because neither would still be an answer to what is being asked.
function panelView() {
  const v = viewOf(activeTask);
  if (v.sentSig !== lastSig) {
    v.sent = [];
    v.answerDraft = '';
    (v.attach.answer || []).forEach(dropFileUrl);
    v.attach.answer = [];
    v.sentSig = lastSig;
  }
  return v;
}

// A text message no longer locks the panel, so this trail is what tells the user
// it went out. It belongs to the panel on screen and is dropped with it — the
// mockup step has the server's own chat instead and never uses this.
function renderSentTrail() {
  const box = $('#sentTrail');
  if (!box) return;
  box.innerHTML = panelView().sent.map(m => msgHtml('user', m.text, m.attachments)).join('');
}

function pushSent(text, attachments) {
  panelView().sent.push({ text, attachments });
  renderSentTrail();
}

// The composer of a gate that takes free text: what is typed stays with the panel
// until it is sent, so a redraw hands it straight back.
function wireComposer(sel) {
  const v = panelView();
  const el = $(sel);
  el.value = v.answerDraft || '';
  el.addEventListener('input', () => { v.answerDraft = el.value; });
  // Called once the text is on its way out: the box and the draft empty together.
  return () => {
    el.value = '';
    v.answerDraft = '';
    autoGrow(el);
  };
}

function renderQuestion(q, step) {
  // Steps 1-3 are the interactive ones — there an answer is confirmed before it is sent.
  // Step 5 only asks to retry the Chrome extension, which needs no gate.
  const confirmFirst = step.id <= 3;
  const pictures = ATTACH_STEPS.includes(step.id);
  // An answer never locks the panel: the user may follow it with a correction or
  // an afterthought while the agent is still reading the first one.
  const submit = async (value, after) => {
    const count = attachedOf('answer').length;
    if (confirmFirst && !await askConfirm({ title: 'Send this answer?',
      text: [value, count ? `+ ${count} attached image${count > 1 ? 's' : ''}` : '']
        .filter(Boolean).join('\n\n'),
      confirmLabel: 'Send answer' })) return;
    const attachments = await takeAttachments();
    if (!attachments) return;
    if (after) after();
    pushSent(value, attachments);
    sendAnswer({ kind: 'answer', questionId: q.id, value, attachments });
  };
  const opts = (q.options || []).map((o, i) =>
    `<button data-opt="${i}">${esc(o)}</button>`).join('');
  $('#panel').innerHTML = `
    ${panelHead(esc(step.name || STEP_NAMES[step.id - 1]), step)}
    <p>${esc(q.text)}</p>
    <div class="options">${opts}</div>
    <div class="sent" id="sentTrail"></div>
    <label>…or type your own answer</label>
    <textarea id="freeAnswer"></textarea>
    ${pictures ? attachTray('answer') : ''}
    <div class="gate-actions">
      <button id="send">Send answer</button>
      ${pictures ? attachButton('answer') : ''}
      ${step.id === 2 ? backButton() : ''}
    </div>`;
  // The composer first: it is what starts a new panel with an empty tray.
  const clearAnswer = wireComposer('#freeAnswer');
  const takeAttachments = wireAttach('answer');
  document.querySelectorAll('[data-opt]').forEach(btn =>
    btn.addEventListener('click', () =>
      submit(q.options[+btn.dataset.opt], () => btn.classList.add('selected'))));
  $('#send').addEventListener('click', () => {
    const value = $('#freeAnswer').value.trim();
    if (!value && !attachedOf('answer').length) return;
    submit(value, clearAnswer);
  });
  renderSentTrail();
  wireBackButton();
  wireStop(step);
}

// The plan gate shows the refinement's summary; the story gate shows the story itself,
// read from the task dir, with the agent's summary above it.
function renderReview(review, step) {
  const story = step.id === STORY_STEP;
  $('#panel').innerHTML = `
    ${panelHead(story ? 'Story review' : 'Plan review', step)}
    ${story ? `<p class="muted">${esc(review.text)}</p>
    <pre class="report" id="storyText">Loading…</pre>
    <div class="gate-actions">
      <button id="approve">Approve</button>
      <button id="copyStory" class="secondary" disabled>Copy story</button>
    </div>` : `<pre class="summary-text">${esc(review.text)}</pre>
    <button id="approve">Approve</button>`}
    <div class="sent" id="sentTrail"></div>
    <label>…or request changes</label>
    <textarea id="feedback"></textarea>
    ${attachTray('answer')}
    <div class="gate-actions">
      <button id="sendFeedback" class="secondary">Send feedback</button>
      ${attachButton('answer')}
      ${backButton()}
    </div>`;
  const clearFeedback = wireComposer('#feedback');
  const takeAttachments = wireAttach('answer');
  wireStop(step);
  $('#approve').addEventListener('click', async () => {
    const ok = await askConfirm({
      title: story ? 'Approve the story?' : 'Approve the plan?',
      text: story ? 'Implementation starts right away and agents begin changing files in your project.'
        : 'The next step starts right away and agents begin changing files in your project.',
      confirmLabel: 'Approve and continue' });
    if (!ok) return;
    lockPanel('Approved — starting implementation…');
    sendAnswer({ kind: 'decision', decision: 'approve' });
  });
  $('#sendFeedback').addEventListener('click', async () => {
    const t = $('#feedback').value.trim();
    if (!t && !attachedOf('answer').length) return;
    const attachments = await takeAttachments();
    if (!attachments) return;
    clearFeedback();
    pushSent(t, attachments);
    sendAnswer({ kind: 'decision', decision: 'feedback', text: t, attachments });
  });
  renderSentTrail();
  wireBackButton();
  if (story) loadStory();
}

function mockupUrl(review, screen) {
  return `/generated-mockups/${encodeURIComponent(activeTask)}/${
    encodeURIComponent(screen.file)}?rev=${review.rev || 0}`;
}

// Screens numbered <view>.<case> - 1.0, 1.1, 2.0 - are grouped by view, so a dozen states
// of three screens read as three tabs and a row of cases. A screen from a manifest
// without the numbering is a view of its own.
const screenKey = s => String(s.id || s.file);
function mockupViews(screens) {
  const views = [];
  screens.forEach((s, i) => {
    const m = /^(\d+)\.\d+$/.exec(String(s.id || ''));
    const key = m ? m[1] : `#${i}`;
    let view = views.find(g => g.key === key);
    if (!view) {
      view = { key, numbered: !!m, screens: [],
        label: [m && m[1], s.view || s.title || s.id || `Screen ${i + 1}`].filter(Boolean).join(' ') };
      views.push(view);
    }
    view.screens.push(s);
  });
  return views;
}

// The screen picked last, else - when the new round dropped it - the first case of its
// view, else the first screen.
function shownScreen(screens) {
  const picked = viewOf(activeTask).mockupScreen;
  const view = String(picked || '').split('.')[0];
  return screens.find(s => screenKey(s) === picked)
    || (picked && screens.find(s => String(s.id || '').split('.')[0] === view))
    || screens[0] || null;
}

// The panel is ~930 px wide, so a 1280 px mockup is scaled down rather than
// letterboxed — otherwise the preview would misreport the layout.
function drawPreview(review) {
  const box = $('#preview');
  const screen = shownScreen(review.screens || []);
  if (!box) return;
  if (!screen) {
    box.innerHTML = '<p class="muted">No screen to preview yet.</p>';
    return;
  }
  const [w, h] = MOCKUP_VIEWPORTS[viewOf(activeTask).mockupViewport];
  const scale = Math.min(1, (box.clientWidth || w) / w);
  const url = mockupUrl(review, screen);
  box.innerHTML = `
    <div class="frame" style="height:${Math.round(h * scale)}px">
      <iframe id="mockupFrame" src="${esc(url)}" sandbox="allow-scripts"
        style="width:${w}px;height:${h}px;transform:scale(${scale})"></iframe>
    </div>
    <p class="hint"><a href="${esc(url)}" target="_blank" rel="noopener">Open in a new tab ↗</a></p>`;
}

function renderMockupReview(review, step) {
  const screens = review.screens || [];
  const v = viewOf(activeTask);
  const views = mockupViews(screens);
  const viewports = Object.keys(MOCKUP_VIEWPORTS).map(vp =>
    `<button data-viewport="${vp}"${vp === v.mockupViewport ? ' class="selected"' : ''}>${
      vp}</button>`).join('');
  $('#panel').innerHTML = `
    ${panelHead('Mockups', step)}
    ${review.text ? `<pre class="summary-text">${esc(review.text)}</pre>` : ''}
    <div class="mockup-bar">
      <div class="tabs" id="viewTabs"></div>
      <div class="tabs">${viewports}</div>
    </div>
    <div class="tabs cases" id="caseTabs"></div>
    <div id="preview"></div>
    <div class="chat" id="stepChat">${chatHtml(step.chat || [])}</div>
    <div class="gate-actions">
      <button id="approveMockup">Approve mockups</button>
      ${screenshotsButton()}
      ${backButton()}
    </div>
    <p class="hint" id="shotsHint" hidden></p>
    <div class="composer">
      ${attachTray('mockup')}
      <textarea id="mockupFeedback" data-max-vh="30" rows="1"
        placeholder="Describe what to change — Ctrl+Enter sends"></textarea>
      ${attachButton('mockup')}
      <button id="sendMockup" class="secondary">Send</button>
    </div>`;
  // Whatever was half-typed when the agent's next round landed.
  $('#mockupFeedback').value = v.mockupDraft || '';
  // A row of views, and under it the cases of the view on screen. Picking a view opens
  // its first case.
  const drawTabs = () => {
    const shown = shownScreen(screens);
    const open = views.find(g => g.screens.includes(shown));
    $('#viewTabs').innerHTML = views.map(g => `<button data-view="${esc(g.key)}"${
      g === open ? ' class="selected"' : ''}>${esc(g.label)}</button>`).join('')
      || '<span class="muted">No screens yet</span>';
    $('#caseTabs').innerHTML = open && open.numbered ? open.screens.map(s =>
      `<button data-screen="${esc(screenKey(s))}"${s === shown ? ' class="selected"' : ''}>${
        esc([s.id, s.title].filter(Boolean).join(' '))}</button>`).join('') : '';
    const pick = key => {
      v.mockupScreen = key;
      drawTabs();
      drawPreview(review);
    };
    document.querySelectorAll('#viewTabs [data-view]').forEach(btn => btn.addEventListener('click',
      () => pick(screenKey(views.find(g => g.key === btn.dataset.view).screens[0]))));
    document.querySelectorAll('#caseTabs [data-screen]').forEach(btn =>
      btn.addEventListener('click', () => pick(btn.dataset.screen)));
  };
  drawTabs();
  document.querySelectorAll('[data-viewport]').forEach(btn =>
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-viewport]')
        .forEach(other => other.classList.toggle('selected', other === btn));
      v.mockupViewport = btn.dataset.viewport;
      drawPreview(review);
    }));
  const takeAttachments = wireAttach('mockup');
  // Sending does not lock: the user may add a second thought before the agent has
  // even read the first. The server records each message as it arrives, so the chat
  // shows it without waiting for the orchestrator to come back round.
  const send = async () => {
    const el = $('#mockupFeedback');
    const t = el.value.trim();
    if (!t && !attachedOf('mockup').length) return;
    const attachments = await takeAttachments();
    if (!attachments) return;
    el.value = '';
    v.mockupDraft = '';
    autoGrow(el);
    await sendAnswer({ kind: 'mockup', decision: 'feedback', text: t, attachments });
    tick();
  };
  $('#mockupFeedback').addEventListener('input', () => {
    v.mockupDraft = $('#mockupFeedback').value;
  });
  $('#mockupFeedback').addEventListener('keydown', e => {
    if (e.key !== 'Enter' || !(e.ctrlKey || e.metaKey)) return;
    e.preventDefault();
    send();
  });
  $('#sendMockup').addEventListener('click', send);
  $('#approveMockup').addEventListener('click', async () => {
    const ok = await askConfirm({
      title: 'Approve the mockups?',
      text: 'They become the binding UI reference for the implementation and the visual baseline '
        + 'for the E2E comparison. Implementation starts next.',
      confirmLabel: 'Approve and continue' });
    if (!ok) return;
    lockPanel('Approved — the agent is updating spec, plan and checklist…');
    sendAnswer({ kind: 'mockup', decision: 'approve' });
  });
  wireBackButton();
  wireStop(step);
  wireScreenshots();
  drawPreview(review);
}

// The PNGs of every mockup round sit on disk next to the mockups, and a page cannot open
// a local folder - the server does, in the system's file manager. Not through postJson:
// "no screenshots yet" is an answer here, not a send that failed.
const screenshotsButton = () =>
  '<button type="button" id="openShots" class="secondary">Open screenshots folder</button>';
function wireScreenshots() {
  const btn = $('#openShots');
  if (!btn) return;
  btn.addEventListener('click', async () => {
    let res = null;
    let data = {};
    try {
      res = await fetch('/api/open-folder', { method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ taskId: activeTask, folder: SCREENSHOT_DIR }) });
      data = await res.json().catch(() => ({}));
    } catch (_e) { /* said below */ }
    const hint = $('#shotsHint');
    if (!hint) return;
    hint.classList.toggle('error', !res || (!res.ok && res.status !== 404));
    hint.textContent = !res ? 'Could not reach the server.'
      : res.status === 404 ? 'No screenshots yet — they are taken after every round of mockups.'
        : res.ok ? `Opened ${data.path || 'the folder'} in the file manager.`
          : `Could not open the folder (${data.error || res.status}).`;
    hint.hidden = false;
  });
}

const chatHtml = msgs => msgs.map(m => msgHtml(m.role, m.text, m.attachments)).join('');

// Every step's panel carries the conversation with that step's agent. The steps that
// ask something of their own (a question, a plan gate, the mockup review) bring their
// own field and are given the transcript alone; the rest get the composer too — that
// is the only way to say anything to an agent that is already running.
const chatBlock = (step, live) => {
  const pictures = ATTACH_STEPS.includes(step.id);
  return `
  <div class="chat" id="stepChat">${chatHtml(step.chat || [])}</div>
  ${live ? `<div class="composer">
    ${pictures ? attachTray(`msg${step.id}`) : ''}
    <textarea id="stepMessage" data-max-vh="30" rows="1"
      placeholder="Write to the agent — Ctrl+Enter sends"></textarea>
    ${pictures ? attachButton(`msg${step.id}`) : ''}
    <button id="sendStepMessage" class="secondary">Send</button>
  </div>` : ''}`;
};

// Sending does not lock the panel and does not move the step: the agent keeps working
// and answers in the same transcript, so a second thought can follow the first.
function wireChat(step) {
  const el = $('#stepMessage');
  if (!el) return;
  const drafts = viewOf(activeTask).msgDrafts;
  el.value = drafts[step.id] || '';
  el.addEventListener('input', () => { drafts[step.id] = el.value; });
  const takeAttachments = wireAttach(`msg${step.id}`);
  const send = async () => {
    const t = el.value.trim();
    if (!t && !attachedOf(`msg${step.id}`).length) return;
    const attachments = await takeAttachments();
    if (!attachments) return;
    el.value = '';
    drafts[step.id] = '';
    autoGrow(el);
    // The server records the line as it arrives, so it shows without waiting for
    // the orchestrator to come back round the poll.
    await sendAnswer({ kind: 'message', step: step.id, text: t, attachments });
    tick();
  };
  el.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || !(e.ctrlKey || e.metaKey)) return;
    e.preventDefault();
    send();
  });
  $('#sendStepMessage').addEventListener('click', send);
}

// Appended rather than re-rendered: rebuilding the panel would reload the mockup
// preview iframe and throw away whatever is half-typed in the composer.
function updateChat(step) {
  const box = $('#stepChat');
  if (!box) return;
  const msgs = step.chat || [];
  const have = box.childElementCount;
  if (have === msgs.length) return;
  if (have > msgs.length) {
    box.innerHTML = chatHtml(msgs);
    return;
  }
  box.insertAdjacentHTML('beforeend', chatHtml(msgs.slice(have)));
}

function renderProgress(task, step) {
  const live = liveOf(task, step);
  // The mockups step offers its screenshots from the first round on, and after approval.
  const shots = step.id === 3 && step.status !== 'waiting';
  $('#panel').innerHTML = `
    ${panelHead(esc(step.name), step)}
    <div class="bar"><div id="barFill"></div></div>
    <div class="op" id="op"></div>
    ${shots ? `<div class="gate-actions">${screenshotsButton()}</div>
    <p class="hint" id="shotsHint" hidden></p>` : ''}
    <ul class="log" id="log"></ul>
    ${chatBlock(step, live)}`;
  wireChat(step);
  wireStop(step);
  wireScreenshots();
  updateDynamic(task, step);
}

// Runs on every tick of a view-only step, which is most of a long run — so each
// piece is written only when its own value actually moved.
function updateDynamic(task, step) {
  updateChat(step);
  const fill = $('#barFill');
  if (fill) {
    const indeterminate = step.progress == null && step.status === 'in_progress';
    const width = indeterminate ? '100%' : `${step.progress || 0}%`;
    fill.classList.toggle('indeterminate', indeterminate);
    if (fill.style.width !== width) fill.style.width = width;
  }
  const op = $('#op');
  const opText = (step.progress != null ? `${step.progress}% — ` : '')
    + (step.currentOperation || '');
  if (op && op.textContent !== opText) op.textContent = opText;
  const log = $('#log');
  if (!log) return;
  const entries = step.log.slice(-15);
  const sigNow = `${step.log.length}|${entries.length && entries[entries.length - 1].time}`;
  if (log.dataset.sig === sigNow) return;
  log.dataset.sig = sigNow;
  log.innerHTML = entries.reverse().map(e =>
    `<li><time>${esc(e.time.slice(11, 19))}</time>${esc(e.text)}</li>`).join('');
}

function renderFailed(step, live) {
  // Step 7 runs after the pipeline is already finished, so declining its retry drops
  // the user back on the summary instead of ending the run.
  const isMockoon = step.id === MOCKOON_STEP;
  // The server's own report for a Stop: the same gate, but nothing went wrong.
  const outcome = step.report === STOPPED_REPORT ? 'stopped' : 'failed';
  // Nobody is waiting on this one any more, so Retry and Finish would send a
  // decision into an empty queue for a later gate to mistake for its own.
  if (!live) {
    $('#panel').innerHTML = `
      <h2>${esc(step.name)} — ${outcome}</h2>
      <pre class="report">${esc(step.report || 'No report provided.')}</pre>
      <p class="muted">The pipeline is no longer waiting on this step.</p>
      ${chatBlock(step, false)}`;
    return;
  }
  // The agent that failed is gone, so what is typed here is not for it: the
  // orchestrator holds it and hands it to the fresh agent a retry spawns.
  $('#panel').innerHTML = `
    <h2>${esc(step.name)} — ${outcome}</h2>
    <pre class="report">${esc(step.report || 'No report provided.')}</pre>
    <button id="retry" class="danger">Retry step</button>
    <button id="${isMockoon ? 'backToSummary' : 'finish'}" class="secondary">${
      isMockoon ? 'Back to summary' : 'Finish'}</button>
    ${chatBlock(step, true)}`;
  wireChat(step);
  $('#retry').addEventListener('click', () => {
    lockPanel('Retrying the step…');
    sendAnswer({ kind: 'decision', decision: 'retry' });
  });
  if (isMockoon) {
    // The decision still goes out — it is what releases the orchestrator's failure gate.
    $('#backToSummary').addEventListener('click', () => {
      sendAnswer({ kind: 'decision', decision: 'finish' });
      backToSummary();
    });
    return;
  }
  $('#finish').addEventListener('click', () => {
    lockPanel('Finishing the pipeline…');
    sendAnswer({ kind: 'decision', decision: 'finish' });
  });
}

function backToSummary() {
  const v = viewOf(activeTask);
  v.showSummary = true;
  v.viewStep = null;
  lastSig = null;
  tick();
}

// navigator.clipboard works on 127.0.0.1 (a secure context), but a denied permission
// or an older browser must still copy — hence the hidden-textarea fallback.
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return;
  } catch (_e) { /* fall through to the legacy path */ }
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  ta.remove();
}

function renderMockoon(task, step) {
  if (step.status !== 'completed') return renderProgress(task, step);
  $('#panel').innerHTML = `
    <h2>${esc(step.name)}</h2>
    <p class="muted">Import it in Mockoon (Import/export → Mockoon's format → from clipboard).
      The environment listens on <code>http://localhost:3000</code>.</p>
    <pre class="report" id="mockoonJson">Loading…</pre>
    <button id="copyMockoon" disabled>Copy JSON</button>
    <button id="backToSummary" class="secondary">Back to summary</button>`;
  $('#backToSummary').addEventListener('click', backToSummary);
  const copy = $('#copyMockoon');
  // The environment is fetched straight from the session dir, so nothing renders
  // it into the orchestrator's context on the way here.
  fetch(`/api/mockoon?taskId=${encodeURIComponent(activeTask)}`)
    .then(r => (r.ok ? r.text() : Promise.reject(new Error(String(r.status)))))
    .then(text => {
      $('#mockoonJson').textContent = text;
      copy.disabled = false;
      copy.addEventListener('click', async () => {
        await copyText(text);
        copy.textContent = 'Copied';
        setTimeout(() => { copy.textContent = 'Copy JSON'; }, 2000);
      });
    })
    .catch(() => {
      $('#mockoonJson').textContent = 'mockoon.json is missing — regenerate the mocks.';
    });
}

// The story is read straight from the task dir, like the Mockoon environment, and
// shown as plain text: it is meant to be pasted into a tracker exactly as written.
function loadStory() {
  const copy = $('#copyStory');
  fetch(`/api/story?taskId=${encodeURIComponent(activeTask)}`)
    .then(r => (r.ok ? r.text() : Promise.reject(new Error(String(r.status)))))
    .then(text => {
      $('#storyText').textContent = text;
      copy.disabled = false;
      copy.addEventListener('click', async () => {
        await copyText(text);
        copy.textContent = 'Copied';
        setTimeout(() => { copy.textContent = 'Copy story'; }, 2000);
      });
    })
    .catch(() => {
      $('#storyText').textContent = 'story.md is missing — resubmit the requirements to write it again.';
    });
}

function renderStory(task, step) {
  $('#panel').innerHTML = `
    <h2>${esc(step.name)}</h2>
    <pre class="report" id="storyText">Loading…</pre>
    <button id="copyStory" disabled>Copy story</button>
    ${chatBlock(step, liveOf(task, step))}`;
  wireChat(step);
  loadStory();
}

function renderSummary(task) {
  const sum = task.summary;
  const mockoon = task.steps.find(s => s.id === MOCKOON_STEP) || {};
  const hasMocks = mockoon.status === 'completed';
  const story = task.steps.find(s => s.id === STORY_STEP) || {};
  const hasStory = story.enabled !== false && story.status === 'completed';
  const list = items => `<ul>${(items || []).map(i => `<li>${esc(i)}</li>`).join('')}</ul>`;
  const block = text => `<pre class="summary-text">${esc(text || '—')}</pre>`;
  $('#panel').innerHTML = `<div class="summary">
    <h2>Pipeline summary</h2>
    <section><h3>Final status</h3>
      <p class="status-final">${esc(sum.finalStatus || '')}</p></section>
    <section><h3>Changes</h3>${list(sum.changes)}</section>
    <section><h3>Implemented features</h3>${list(sum.features)}</section>
    <section><h3>Test results</h3>${block(sum.tests)}</section>
    <section><h3>API mocks</h3>${block(sum.apiMocks)}</section>
    <section><h3>Mockup comparison</h3>${block(sum.mockupComparison)}</section>
    <section><h3>UX review</h3>${block(sum.uxReview)}</section>
    <section><h3>Code review</h3>${block(sum.codeReview)}</section>
    ${hasStory ? `<section id="story-section"><h3>Story</h3>
      <pre class="summary-text" id="storyText">Loading…</pre>
      <button id="copyStory" disabled>Copy story</button></section>` : ''}
    <section id="mockoon-section"><h3>Mockoon mocks</h3>
      <p class="muted">A ready-to-import Mockoon environment for the feature's API,
        listening on <code>http://localhost:3000</code>.</p>
      ${hasMocks ? '<button id="showMockoon">Show Mockoon JSON</button>' : ''}
      <button id="generateMockoon"${hasMocks ? ' class="secondary"' : ''}>${
        hasMocks ? 'Regenerate' : 'Generate Mockoon mocks'}</button>
    </section>
    <section id="shutdown-section">
      <button id="shutdown" class="secondary">Shut down server</button>
    </section>
  </div>`;
  if (hasStory) loadStory();
  // Already generated: the JSON is one local switch away, no agent needed.
  if (hasMocks) {
    $('#showMockoon').addEventListener('click', () => {
      viewOf(activeTask).showSummary = false;
      tick();
    });
  }
  $('#generateMockoon').addEventListener('click', () => {
    lockPanel('Requested — the agent is building the Mockoon environment…');
    sendAnswer({ kind: 'summary', decision: 'mockoon' });
  });
  $('#shutdown').addEventListener('click', async () => {
    serverDown = true;
    $('#shutdown').disabled = true;
    // Ends the orchestrator's post-summary poll before the socket dies under it.
    try { await sendAnswer({ kind: 'summary', decision: 'shutdown' }); } catch (_e) { /* gone */ }
    try { await postJson('/api/shutdown', {}); } catch (_e) { /* server exits mid-response */ }
    $('#shutdown-section').innerHTML =
      '<p class="muted">Server stopped — you can close this tab.</p>';
  });
}

// Both ways to start another task. They sit in the rail rather than in the step-1
// panel, so they work from whatever step the open task is on — and that is also why
// the copy reads step 1 from the task itself instead of from the DOM: the panel on
// screen is usually showing something else entirely.
async function newTask(copy, btn) {
  const task = currentTask();
  if (!task) return;
  btn.disabled = true;
  // A no-op unless the step-1 form is the panel on screen; when it is, this is what
  // puts the half-typed version of it into the draft step1Of then reads.
  snapshotStep1();
  const v = viewOf(task.id);
  const from = step1Of(task);
  // Credentials are deliberately not among the values: they never travel through the
  // state document. The server copies the source task's auth.json instead, and what
  // was typed but not submitted rides across in the draft below.
  const { id } = await postJson('/api/tasks', copy ? { copyFrom: task.id, values: {
    taskDescription: from.taskDescription,
    contractsText: from.contractsText, hintsNote: from.hintsNote,
    refinement: from.refinement, generateMockups: from.generateMockups,
    storyDescription: from.storyDescription, codeReview: from.codeReview,
    agents: agentsOf(from) } } : {});
  if (id) {
    // The server copies what it holds — the form and the uploaded files. What only the
    // page holds, typed credentials and files picked but not uploaded yet, is carried
    // here. The branch is not: two tasks cannot share one, so the copy starts without it.
    if (copy) {
      viewOf(id).draft = { ...from, branch: '' };
      viewOf(id).picked = { ...v.picked };
    }
    // A brand-new task sits at waiting; put it straight into its form.
    await postJson('/api/state', { taskId: id, step: 1, status: 'in_progress', activeStep: 1 });
    activeTask = id;
  }
  btn.disabled = false;
  lastSig = null;
  tick();
}
// Non-destructive and reversible with the tab's ×, so neither asks to confirm — and
// both stay live on a frozen task, which is the way to change direction.
$('#createTask').addEventListener('click', e => newTask(true, e.currentTarget));
$('#createEmptyTask').addEventListener('click', e => newTask(false, e.currentTarget));

// The rail is chrome, not pipeline state. Its width is remembered for this page only:
// the server picks a fresh port every run, so the store dies with the session anyway.
const SIDEBAR_KEY = 'inf.sidebar.collapsed';
function setSidebar(collapsed) {
  const btn = $('#sidebarToggle');
  document.documentElement.dataset.rail = collapsed ? 'collapsed' : 'open';
  btn.innerHTML = collapsed ? CHEVRON_RIGHT : CHEVRON_LEFT;
  btn.setAttribute('aria-expanded', String(!collapsed));
  const label = collapsed ? 'Show sidebar' : 'Hide sidebar';
  btn.setAttribute('aria-label', label);
  btn.setAttribute('title', label);
  try { localStorage.setItem(SIDEBAR_KEY, collapsed ? '1' : '0'); } catch (_e) { /* blocked */ }
}
$('#sidebarToggle').addEventListener('click', () =>
  setSidebar(document.documentElement.dataset.rail !== 'collapsed'));
let sidebarCollapsed = false;
try { sidebarCollapsed = localStorage.getItem(SIDEBAR_KEY) === '1'; } catch (_e) { /* blocked */ }
setSidebar(sidebarCollapsed);

// The flag list changes only with the plugin, so one request per page is enough.
fetch('/api/review-flags')
  .then(r => (r.ok ? r.json() : Promise.reject(new Error(String(r.status)))))
  .then(j => {
    reviewFlags = Array.isArray(j.flags) ? j.flags : [];
    reviewRunsMax = j.maxRuns || reviewRunsMax;
    reviewRunsDefault = j.defaultRuns || reviewRunsDefault;
    if (refreshRuns) refreshRuns();
  })
  .catch(() => { /* the runs keep showing the flags they hold, by name */ });

setInterval(tick, 1000);
tick();
</script>
</body>
</html>
